<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOSS-AI Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
    /* 기본 리셋 */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    
    body {
        font-family: "Nanum Gothic", -apple-system, sans-serif;
        background-color: #fff0f5; /* 연한 라벤더 핑크 배경 */
        color: #4a3b40;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
        position: relative;
        /* 웹페이지 드래그 방지 */
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
    }

    /* 메인 컨테이너 */
    .portal-container {
        background: #ffffff;
        width: 100%;
        max-width: 520px;
        border-radius: 32px;
        box-shadow: 0 12px 36px rgba(255, 182, 193, 0.3);
        overflow: hidden;
        border: 4px solid #ffe4e1; /* 미스티 로즈 테두리 */
        position: relative;
        z-index: 1;
    }

    /* 헤더 영역 */
    .portal-header {
        background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 100%);
        padding: 45px 24px 35px;
        text-align: center;
        position: relative;
        overflow: hidden;
    }

    /* 배경에 흩날리는 미니 리본들 */
    .bg-ribbons {
        position: absolute;
        inset: 0;
        pointer-events: none;
    }
    .bg-ribbons svg {
        position: absolute;
        fill: #ff4d79;
        opacity: 0.35;
        animation: floatRibbon 4s ease-in-out infinite;
    }
    /* 미니 리본들 위치와 크기, 애니메이션 지연 세팅 */
    .bg-ribbons svg:nth-child(1) { top: 15%; left: 8%; width: 22px; height: 22px; animation-delay: 0s; }
    .bg-ribbons svg:nth-child(2) { top: 20%; right: 10%; width: 26px; height: 26px; animation-delay: 0.7s; }
    .bg-ribbons svg:nth-child(3) { bottom: 15%; left: 12%; width: 24px; height: 24px; animation-delay: 1.3s; }
    .bg-ribbons svg:nth-child(4) { bottom: 20%; right: 15%; width: 20px; height: 20px; animation-delay: 0.3s; }
    .bg-ribbons svg:nth-child(5) { top: 50%; left: 45%; width: 18px; height: 18px; animation-delay: 1.8s; opacity: 0.2; }

    @keyframes floatRibbon {
        0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
        50% { transform: translateY(-5px) rotate(15deg) scale(1.1); }
    }

    /* 메인 헬로키티 리본 아이콘 */
    .kitty-ribbon-main {
        width: 65px;
        height: 65px;
        margin-bottom: 12px;
        display: inline-block;
        position: relative;
        z-index: 2;
        animation: mainFloat 3s ease-in-out infinite;
    }

    @keyframes mainFloat {
        0%, 100% { transform: translateY(0) rotate(-4deg); }
        50% { transform: translateY(-6px) rotate(4deg); }
    }

    .portal-title {
        font-family: "Gaegu", sans-serif;
        font-size: 34px;
        color: #ff6584;
        letter-spacing: 1px;
        position: relative;
        z-index: 2;
    }

    /* 메뉴 그리드 */
    .menu-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        padding: 24px;
    }

    /* 메뉴 카드 스타일 */
    .menu-card {
        background: #ffffff;
        border: 2px solid #ffe5ec;
        border-radius: 20px;
        padding: 20px 14px;
        text-align: center;
        text-decoration: none;
        color: inherit;
        transition: all 0.25s ease;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 8px rgba(255, 229, 236, 0.2);
    }

    .menu-card:hover {
        transform: translateY(-5px);
        background: #fff8f9;
        border-color: #ffb3c6;
        box-shadow: 0 8px 20px rgba(255, 179, 198, 0.4);
    }

    /* 준비중 카드 스타일 */
    .menu-card.disabled {
        opacity: 0.6;
        background: #fafafa;
        border-color: #e0e0e0;
        cursor: not-allowed;
    }
    
    .menu-card.disabled:hover {
        transform: none;
        box-shadow: none;
    }

    .card-icon {
        font-size: 32px;
        margin-bottom: 10px;
    }

    .card-title {
        font-size: 15px;
        font-weight: 800;
        color: #ff6584;
        margin-bottom: 6px;
    }
    
    .menu-card.disabled .card-title {
        color: #888888;
    }

    .card-desc {
        font-size: 11px;
        color: #7c6a70;
        line-height: 1.5;
        word-break: keep-all;
    }

    .badge-ready {
        display: inline-block;
        margin-top: 8px;
        font-size: 10px;
        padding: 2px 10px;
        border-radius: 12px;
        background: #f0f0f0;
        color: #999999;
        font-weight: 700;
    }

    /* 푸터 영역 */
    .portal-footer {
        text-align: center;
        padding: 16px;
        font-size: 11px;
        color: #bfa3ab;
        background: #fff8f9;
        border-top: 1px solid #ffe5ec;
        font-weight: 700;
    }

    /* 우측 하단 고정 워터마크 (boss_min_) */
    .fixed-watermark {
        position: fixed;
        right: 20px;
        bottom: 20px;
        font-family: "Gaegu", sans-serif;
        font-size: 16px;
        font-weight: 700;
        color: #ff6584;
        opacity: 0.25; /* 흐리게 처리 */
        letter-spacing: 1px;
        z-index: 9999;
        pointer-events: none; /* 마우스 이벤트 방지 */
    }
</style>
</head>
<body oncontextmenu="return false" onselectstart="return false" ondragstart="return false">

        <div class="bg-ribbons">

        <!-- 6. 내 여행 지도 -->
        <a href="travel-tracker.html" class="menu-card" style="border-color: #a5d8ff;">

    <!-- 푸터 -->

</div>

<!-- 화면 우측 하단 고정 마크 -->
<div class="fixed-watermark">boss_min_</div>

<script>
    // 마우스 우클릭 차단
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });

    // F12 및 개발자 도구 단축키 차단
    document.addEventListener('keydown', function(e) {
        if (e.keyCode == 123 || 
            (e.ctrlKey && e.shiftKey && e.keyCode == 73) || 
            (e.ctrlKey && e.shiftKey && e.keyCode == 67) || 
            (e.ctrlKey && e.keyCode == 85)) { 
            e.preventDefault();
        }
    });
</script>

</body>
</html>
