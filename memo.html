<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tax Management Hub - Advanced</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --sidebar-width: 280px;
            --primary-blue: #2c3e50;
            --accent-gold: #f39c12;
            --bg-light: #f8f9fa;
            --success-green: #27ae60;
            --notice-red: #e74c3c;
        }
        body { font-family: 'Pretendard', sans-serif; display: flex; height: 100vh; margin: 0; background: var(--bg-light); }
        
        /* 사이드바 */
        #sidebar { width: var(--sidebar-width); background: var(--primary-blue); color: white; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid #34495e; }
        .btn-container { display: flex; flex-direction: column; gap: 8px; }
        
        button { padding: 10px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-add { background: #34495e; color: white; font-size: 0.8rem; border: 1px solid #5d6d7e; }
        .btn-excel { background: var(--success-green); color: white; font-size: 0.8rem; text-align: center; cursor: pointer; display: block; padding: 10px; border-radius: 6px; }
        
        #clientList { flex: 1; overflow-y: auto; list-style: none; padding: 0; margin: 0; }
        .client-item { padding: 15px 20px; border-bottom: 1px solid #34495e; cursor: pointer; }
        .client-item:hover { background: #3e5871; }
        .client-item.active { background: var(--accent-gold); font-weight: bold; }

        /* 메인 콘텐츠 */
        #main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; }
        h2 { margin-top: 0; color: var(--primary-blue); border-bottom: 2px solid var(--accent-gold); display: inline-block; padding-bottom: 5px; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-family: inherit; }

        /* 메시지 도구 */
        .msg-box { background: #eef2f7; padding: 15px; border-radius: 8px; white-space: pre-wrap; margin: 10px 0; border: 1px solid #d1d9e4; min-height: 50px; }
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        .btn-save { background: var(--primary-blue); color: white; }
        .btn-copy { background: #25d366; color: white; width: 100%; margin-top: 10px; }
        
        /* 공지 탭 전용 */
        .notice-btn { background: #ecf0f1; color: #2c3e50; font-size: 0.85rem; border: 1px solid #bdc3c7; }
        .notice-btn:hover { background: #dce4e6; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="sidebar-header">
        <h3>나의 업체 리스트</h3>
        <div class="btn-container">
            <button class="btn-add" onclick="addClient()">+ 개별 업체 추가</button>
            <label for="excelInput" class="btn-excel">📊 위하고 엑셀 반영</label>
            <input type="file" id="excelInput" accept=".xlsx, .xls" style="display: none;" onchange="handleExcelUpload(event)">
        </div>
    </div>
    <ul id="clientList"></ul>
</div>

<div id="main-content">
    <!-- 업체 상세 관리 -->
    <div id="clientDetail" style="display: none;">
        <h2 id="view-clientName">업체 정보</h2>
        <div class="card">
            <div class="form-group">
                <label>업체 특이사항</label>
                <textarea id="edit-memo" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>이 업체 전용 메모/문구</label>
                <textarea id="edit-customMsg" rows="2"></textarea>
            </div>
            <button class="btn-save" onclick="updateClientData()">변경내역 저장</button>
        </div>
        <div class="card">
            <h3>🚀 개별 퀵 메시지</h3>
            <div id="finalMsg" class="msg-box">업체를 선택하고 버튼을 누르세요.</div>
            <button class="btn-copy" onclick="copyToClipboard('finalMsg')">카톡 문구 복사하기</button>
        </div>
    </div>

    <!-- 전체 공지 관리 섹션 -->
    <div class="card" style="border: 2px solid var(--notice-red);">
        <h2 style="color: var(--notice-red); border-bottom-color: var(--notice-red);">📢 전체 공지 메시지 생성</h2>
        
        <div class="form-group" style="margin-top: 15px;">
            <label>📅 마감/납부 기한 입력</label>
            <input type="text" id="global-date" placeholder="예: 5월 10일(월)" oninput="updateNoticePreview()">
        </div>

        <div class="btn-group">
            <button class="notice-btn" onclick="setNoticeType('원천세')">원천세 신고납부</button>
            <button class="notice-btn" onclick="setNoticeType('부가세')">부가세 신고납부</button>
            <button class="notice-btn" onclick="setNoticeType('법인세')">법인세 신고납부</button>
            <button class="notice-btn" onclick="setNoticeType('소득세')">소득세 신고납부</button>
            <button class="notice-btn" onclick="setNoticeType('예정고지')">부가세 예정고지</button>
        </div>

        <div id="globalMsgPreview" class="msg-box" style="margin-top: 20px; background: #fff5f5;">날짜를 입력하고 항목을 선택하세요.</div>
        <button class="btn-copy" style="background: var(--notice-red);" onclick="copyToClipboard('globalMsgPreview')">전체 공지 복사하기</button>
    </div>
</div>

<script>
    let clients = JSON.parse(localStorage.getItem('taxClients')) || [];
    let currentClientId = null;
    let currentNoticeType = '';

    // 1. 리스트 렌더링
    function renderList() {
        const listEl = document.getElementById('clientList');
        listEl.innerHTML = "";
        clients.sort((a, b) => a.name.localeCompare(b.name));
        clients.forEach(c => {
            const li = document.createElement('li');
            li.className = `client-item ${currentClientId === c.id ? 'active' : ''}`;
            li.innerText = c.name;
            li.onclick = () => selectClient(c.id);
            listEl.appendChild(li);
        });
    }

    // 2. 업체 선택
    function selectClient(id) {
        currentClientId = id;
        const client = clients.find(c => c.id === id);
        document.getElementById('clientDetail').style.display = "block";
        document.getElementById('view-clientName').innerText = client.name;
        document.getElementById('edit-memo').value = client.memo || "";
        document.getElementById('edit-customMsg').value = client.customMsg || "";
        document.getElementById('finalMsg').innerText = `안녕하세요 ${client.name} 사장님, 세무법인입니다.\n\n${client.customMsg || '신고 관련 안내드립니다.'}`;
        renderList();
    }

    // 3. 전체 공지 로직
    const noticeTemplates = {
        '원천세': "안녕하세요 사장님, 세무법인입니다.\n이번 달 원천세 신고 및 납부 기한은 {date}까지입니다.\n급여 변동 내역이 있으시면 미리 말씀 부탁드립니다.",
        '부가세': "안녕하세요 사장님!\n부가세 신고 기간입니다. 자료 제출 및 납부 기한은 {date}까지입니다.\n준비하신 서류는 사무실로 전달 부탁드립니다.",
        '법인세': "안녕하세요 사장님, 법인세 신고 안내입니다.\n{date}까지 법인세 납부를 완료해주셔야 합니다.\n관련 납부서를 송부해드리오니 확인 부탁드립니다.",
        '소득세': "안녕하세요 사장님, 종합소득세 신고 안내입니다.\n신고 및 납부 기한인 {date}를 넘기지 않도록 주의 부탁드립니다.",
        '예정고지': "안녕하세요 사장님!\n이번 부가세 예정고지 납부 기한은 {date}까지입니다.\n카톡으로 보내드린 고지서 확인 후 납부 부탁드립니다."
    };

    function setNoticeType(type) {
        currentNoticeType = type;
        updateNoticePreview();
    }

    function updateNoticePreview() {
        if (!currentNoticeType) return;
        const date = document.getElementById('global-date').value || "____";
        let text = noticeTemplates[currentNoticeType].replace("{date}", date);
        document.getElementById('globalMsgPreview').innerText = text;
    }

    // 4. 데이터 관리 (엑셀, 저장 등)
    function handleExcelUpload(event) {
        const file = event.target.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
            let count = 0;
            rows.forEach(row => {
                const name = row['거래처명'] || row['상호'] || row['사업자명'];
                if (name && !clients.find(c => c.name === name.trim())) {
                    clients.push({ id: Date.now() + Math.random(), name: name.trim(), memo: "", customMsg: "" });
                    count++;
                }
            });
            localStorage.setItem('taxClients', JSON.stringify(clients));
            renderList();
            alert(count + "개 업체 추가 완료!");
        };
        reader.readAsArrayBuffer(file);
    }

    function updateClientData() {
        const idx = clients.findIndex(c => c.id === currentClientId);
        clients[idx].memo = document.getElementById('edit-memo').value;
        clients[idx].customMsg = document.getElementById('edit-customMsg').value;
        localStorage.setItem('taxClients', JSON.stringify(clients));
        alert("저장되었습니다.");
        selectClient(currentClientId);
    }

    function addClient() {
        const name = prompt("업체명 입력:");
        if(name) {
            clients.push({ id: Date.now(), name: name.trim(), memo: "", customMsg: "" });
            localStorage.setItem('taxClients', JSON.stringify(clients));
            renderList();
        }
    }

    function copyToClipboard(elementId) {
        const text = document.getElementById(elementId).innerText;
        navigator.clipboard.writeText(text).then(() => alert("복사되었습니다!"));
    }

    renderList();
</script>
</body>
</html>
