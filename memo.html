<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tax Firm Work Helper</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333;
        }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg-color); color: var(--text-color); margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        
        /* 업체 메모 섹션 */
        .section { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { margin-top: 0; font-size: 1.2rem; color: var(--primary-color); }
        
        .search-box { display: flex; gap: 10px; margin-bottom: 15px; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
        button { padding: 10px 20px; background: var(--primary-color); color: white; border: none; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #357abd; }

        /* 메시지 생성기 섹션 */
        .msg-buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        .btn-template { background: #6c757d; font-size: 0.9rem; }
        
        #messageArea { background: #e9ecef; min-height: 80px; white-space: pre-wrap; margin-bottom: 10px; }
        .copy-success { color: #28a745; font-size: 0.8rem; display: none; }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. 업체 특이사항 메모 기능 -->
    <div class="section">
        <h2>🏢 업체별 특이사항 메모</h2>
        <div class="search-box">
            <input type="text" id="clientName" placeholder="업체명 입력 (예: (주)대박상사)">
            <button onclick="saveMemo()">저장</button>
        </div>
        <textarea id="clientMemo" rows="3" placeholder="사장님 성향, 급여일, 주의사항 등을 기록하세요."></textarea>
        <p style="font-size: 0.8rem; color: #888;">* 입력 후 저장을 누르면 브라우저에 자동 저장됩니다.</p>
    </div>

    <!-- 2. 메시지 생성기 기능 -->
    <div class="section">
        <h2>💬 카톡 안내문 생성기</h2>
        <div class="msg-buttons">
            <button class="btn-template" onclick="generate('infra')">신규입사자 서류</button>
            <button class="btn-template" onclick="generate('vat')">부가세 자료요청</button>
            <button class="btn-template" onclick="generate('pay')">급여대장 송부</button>
        </div>
        <div id="messageArea" class="section" style="box-shadow: none; border: 1px dashed #ccc;">문구 버튼을 클릭하세요.</div>
        <button onclick="copyMsg()" style="width: 100%; background: #ffeb3b; color: #3c1e1e; font-weight: bold;">카톡용 문구 복사하기</button>
        <span id="copyNotice" class="copy-success">클립보드에 복사되었습니다!</span>
    </div>
</div>

<script>
    // 1. 메모 저장 및 불러오기 로직
    const nameInput = document.getElementById('clientName');
    const memoInput = document.getElementById('clientMemo');

    function saveMemo() {
        const name = nameInput.value.trim();
        const memo = memoInput.value.trim();
        if(!name) return alert("업체명을 입력해주세요.");
        localStorage.setItem(name, memo);
        alert("저장되었습니다.");
    }

    // 이름 입력할 때마다 저장된 메모 검색
    nameInput.addEventListener('input', () => {
        const savedMemo = localStorage.getItem(nameInput.value.trim());
        memoInput.value = savedMemo ? savedMemo : "";
    });

    // 2. 메시지 생성 로직
    const msgArea = document.getElementById('messageArea');
    
    const templates = {
        infra: "안녕하세요 사장님!\n신규 입사자 신고를 위해 아래 서류 전달 부탁드립니다.\n1. 신분증 사본\n2. 통장 사본\n3. 근로계약서 양식",
        vat: "안녕하세요 사장님, 세무법인입니다.\n부가세 신고 기간을 맞아 아래 자료 리스트 확인 부탁드립니다.\n- 매출/매입 세금계산서\n- 카드 사용 내역\n- 현금영수증 조회 내역",
        pay: "사장님, 이번 달 급여대장 작업 완료되어 보내드립니다.\n확인해 보시고 수정사항 있으시면 말씀 부탁드립니다. 감사합니다!"
    };

    function generate(type) {
        const client = nameInput.value || "사장님";
        let text = templates[type].replace("사장님", client + " 사장님");
        msgArea.innerText = text;
    }

    function copyMsg() {
        const text = msgArea.innerText;
        navigator.clipboard.writeText(text).then(() => {
            const notice = document.getElementById('copyNotice');
            notice.style.display = 'inline';
            setTimeout(() => notice.style.display = 'none', 2000);
        });
    }
</script>

</body>
</html>
