<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tax Management Hub</title>
    <style>
        :root {
            --sidebar-width: 280px;
            --primary-blue: #2c3e50;
            --accent-gold: #f39c12;
            --bg-light: #f8f9fa;
        }
        body { font-family: 'Pretendard', sans-serif; display: flex; height: 100vh; margin: 0; background: var(--bg-light); }
        
        /* 사이드바: 업체 리스트 */
        #sidebar { width: var(--sidebar-width); background: var(--primary-blue); color: white; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid #34495e; text-align: center; }
        #clientList { flex: 1; overflow-y: auto; list-style: none; padding: 0; margin: 0; }
        .client-item { padding: 15px 20px; border-bottom: 1px solid #34495e; cursor: pointer; transition: 0.2s; }
        .client-item:hover { background: #3e5871; }
        .client-item.active { background: var(--accent-gold); font-weight: bold; }

        /* 메인 콘텐츠: 업체 상세 정보 */
        #main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; }
        h2 { margin-top: 0; color: var(--primary-blue); border-bottom: 2px solid var(--accent-gold); display: inline-block; padding-bottom: 5px; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-family: inherit; }

        /* 메시지 도구 */
        .msg-box { background: #eef2f7; padding: 15px; border-radius: 8px; white-space: pre-wrap; margin: 10px 0; border: 1px solid #d1d9e4; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        button { padding: 10px 15px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-save { background: var(--primary-blue); color: white; }
        .btn-copy { background: #25d366; color: white; } /* 카톡 느낌 색상 */
        .btn-global { background: #e74c3c; color: white; }

        /* 일괄 공지 섹션 */
        #global-section { border-top: 2px dashed #ccc; padding-top: 20px; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="sidebar-header">
        <h3>나의 업체 리스트</h3>
        <button onclick="addClient()" style="font-size: 0.8rem; padding: 5px 10px;">+ 업체 추가</button>
    </div>
    <ul id="clientList">
        <!-- JS에서 리스트 생성 -->
    </ul>
</div>

<div id="main-content">
    <!-- 업체별 개별 관리 영역 -->
    <div id="clientDetail" style="display: none;">
        <h2 id="view-clientName">업체를 선택하세요</h2>
        
        <div class="card">
            <div class="form-group">
                <label>업체 특이사항 (급여일, 사장님 성향 등)</label>
                <textarea id="edit-memo" rows="4"></textarea>
            </div>
            <div class="form-group">
                <label>이 업체 전용 카톡 문구 (개인화)</label>
                <textarea id="edit-customMsg" rows="3"></textarea>
            </div>
            <button class="btn-save" onclick="updateClientData()">변경내역 저장</button>
        </div>

        <div class="card">
            <h3>🚀 퀵 메시지 보내기</h3>
            <div id="finalMsg" class="msg-box">문구를 생성하려면 아래 버튼을 누르세요.</div>
            <div class="btn-group">
                <button class="btn-copy" onclick="generateAndCopy('custom')">전용 문구 복사</button>
                <button class="btn-copy" onclick="generateAndCopy('basic')">기본 인사말 복사</button>
            </div>
        </div>
    </div>

    <!-- 일괄 신고기한 공지 영역 -->
    <div id="global-section" class="card">
        <h3>📢 전업체 일괄 공지 (신고기한 등)</h3>
        <textarea id="global-msg-input" rows="3" placeholder="예: [안내] 5월 종합소득세 신고 기간입니다. 자료 준비 부탁드립니다."></textarea>
        <div class="btn-group">
            <button class="btn-global" onclick="copyGlobalMsg()">일괄 공지 문구 복사</button>
        </div>
        <p style="font-size: 0.8rem; color: #666; margin-top: 10px;">* 모든 업체에 동일하게 적용되는 공지사항입니다.</p>
    </div>
</div>

<script>
    // 샘플 데이터 및 로컬 스토리지 로드
    let clients = JSON.parse(localStorage.getItem('taxClients')) || [
        { id: 1, name: "(주)대박상사", memo: "매달 25일 급여일. 사장님 매우 꼼꼼하심.", customMsg: "지난번에 말씀하신 기계장치 리스 서류도 같이 부탁드립니다!" },
        { id: 2, name: "성공식당", memo: "주말 알바생 잦은 교체. 배달 플랫폼 매출 주의.", customMsg: "사장님, 이번 달 배달의민족 매출 내역도 꼭 캡처해서 보내주세요~" }
    ];

    let currentClientId = null;

    // 리스트 렌더링
    function renderList() {
        const listEl = document.getElementById('clientList');
        listEl.innerHTML = "";
        clients.forEach(c => {
            const li = document.createElement('li');
            li.className = `client-item ${currentClientId === c.id ? 'active' : ''}`;
            li.innerText = c.name;
            li.onclick = () => selectClient(c.id);
            listEl.appendChild(li);
        });
    }

    // 업체 선택
    function selectClient(id) {
        currentClientId = id;
        const client = clients.find(c => c.id === id);
        
        document.getElementById('clientDetail').style.display = "block";
        document.getElementById('view-clientName').innerText = client.name;
        document.getElementById('edit-memo').value = client.memo;
        document.getElementById('edit-customMsg').value = client.customMsg;
        document.getElementById('finalMsg').innerText = "업체 전용 문구를 생성하려면 버튼을 누르세요.";
        
        renderList();
    }

    // 데이터 업데이트
    function updateClientData() {
        const idx = clients.findIndex(c => c.id === currentClientId);
        clients[idx].memo = document.getElementById('edit-memo').value;
        clients[idx].customMsg = document.getElementById('edit-customMsg').value;
        
        localStorage.setItem('taxClients', JSON.stringify(clients));
        alert("저장되었습니다!");
    }

    // 업체 추가
    function addClient() {
        const name = prompt("새로운 업체명을 입력하세요.");
        if(name) {
            const newClient = { id: Date.now(), name, memo: "", customMsg: "" };
            clients.push(newClient);
            localStorage.setItem('taxClients', JSON.stringify(clients));
            renderList();
        }
    }

    // 메시지 생성 및 클립보드 복사
    function generateAndCopy(type) {
        const client = clients.find(c => c.id === currentClientId);
        let text = "";
        
        if(type === 'custom') {
            text = `[${client.name}] 사장님, 안녕하세요!\n\n${client.customMsg}\n\n바쁘시겠지만 확인 부탁드립니다.`;
        } else {
            text = `안녕하세요 ${client.name} 사장님, 세무법인입니다.\n원천세 신고 관련하여 보낼 내용이 있으니 확인 부탁드립니다.`;
        }
        
        document.getElementById('finalMsg').innerText = text;
        copyToClipboard(text);
    }

    // 일괄 메시지 복사
    function copyGlobalMsg() {
        const text = document.getElementById('global-msg-input').value;
        if(!text) return alert("공지 내용을 입력해주세요.");
        copyToClipboard(text);
    }

    function copyToClipboard(val) {
        navigator.clipboard.writeText(val).then(() => {
            alert("클립보드에 복사되었습니다. 카톡에 붙여넣으세요!");
        });
    }

    renderList();
</script>

</body>
</html>
