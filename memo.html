<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>세무법인 업무 지원 도구</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --sidebar-width: 280px; --primary: #2c3e50; --accent: #f39c12; --bg: #f4f7f6; }
        body { font-family: 'Pretendard', sans-serif; display: flex; height: 100vh; margin: 0; background: var(--bg); }
        
        #sidebar { width: var(--sidebar-width); background: var(--primary); color: white; display: flex; flex-direction: column; overflow: hidden; }
        .sidebar-header { padding: 15px; border-bottom: 1px solid #34495e; }
        .btn-excel { background: #27ae60; color: white; text-align: center; cursor: pointer; padding: 10px; border-radius: 6px; display: block; margin-bottom: 10px; font-weight: bold; }
        .btn-global-tab { background: #e67e22; color: white; width: 100%; padding: 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; font-size: 1rem; }
        
        #clientList { flex: 1; overflow-y: auto; list-style: none; padding: 0; margin: 0; }
        .client-item { padding: 12px 20px; border-bottom: 1px solid #34495e; cursor: pointer; font-size: 0.9rem; }
        .client-item:hover { background: #3e5871; }
        .client-item.active { background: var(--accent); }

        #main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h2 { margin-top: 0; color: var(--primary); border-bottom: 2px solid var(--accent); display: inline-block; padding-bottom: 5px; }

        .tab-menu { display: flex; gap: 8px; margin-bottom: 15px; }
        .tab-btn { background: #ddd; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: var(--primary); color: white; }
        
        .sub-menu { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        .sub-btn { background: #fff; border: 1px solid #ccc; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .sub-btn.active { border-color: var(--accent); background: #fff9f0; color: var(--accent); }

        .msg-box { background: #eef2f7; padding: 20px; border-radius: 8px; white-space: pre-wrap; border: 1px solid #d1d9e4; line-height: 1.6; min-height: 100px; }
        input[type="text"] { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 6px; box-sizing: border-box; margin-bottom: 15px; font-size: 1rem; }
        .btn-copy { width: 100%; padding: 15px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; font-size: 1.1rem; color: white; margin-top: 10px; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="sidebar-header">
        <label for="excelInput" class="btn-excel">📊 위하고 엑셀 반영</label>
        <input type="file" id="excelInput" accept=".xlsx, .xls" style="display: none;" onchange="handleExcelUpload(event)">
        <button class="btn-global-tab" onclick="showGlobal()">📢 전 체 공 지 탭</button>
        <p style="font-size: 0.8rem; color: #bdc3c7; margin: 15px 0 5px 0;">거래처 개별 메모</p>
    </div>
    <ul id="clientList"></ul>
</div>

<div id="main-content">
    <!-- 전체 공지 화면 -->
    <div id="globalSection">
        <h2>📢 전체 공지 대시보드</h2>
        <div class="card">
            <label style="font-weight: bold; display: block; margin-bottom: 8px;">📅 기한 입력 (문구에 자동 포함)</label>
            <input type="text" id="global-date" placeholder="예: 5월 10일(월)" oninput="updateNotice()">
            
            <div class="tab-menu" id="mainTabs"></div>
            <div class="sub-menu" id="subTabs"></div>

            <div id="noticePreview" class="msg-box"></div>
            <button class="btn-copy" style="background: #e74c3c;" onclick="copyMsg('noticePreview')">공지 문구 복사</button>
        </div>
    </div>

    <!-- 개별 관리 화면 -->
    <div id="clientSection" style="display: none;">
        <h2 id="clientTitle">업체 정보</h2>
        <div class="card">
            <label style="font-weight: bold;">업체 특이사항/메모</label>
            <textarea id="clientMemo" style="width:100%; height:100px; margin-top:10px; padding:10px; border-radius:6px; border:1px solid #ddd;" placeholder="이 업체만의 특징을 적어주세요."></textarea>
            <button class="btn-copy" style="background: var(--primary); font-size: 0.9rem; padding: 10px;" onclick="saveMemo()">메모 저장</button>
        </div>
    </div>
</div>

<script>
    let clients = JSON.parse(localStorage.getItem('taxData')) || [];
    let currentMain = '원천세';
    let currentSub = '';

    const templates = {
        '원천세': {
            '납부서전달': "안녕하세요 사장님!\n원천세 신고가 완료되어 납부서를 보내드립니다.\n납부 기한은 {date}까지입니다.",
            '마감안내': "안녕하세요 사장님, 세무법인입니다.\n원천세 납부 마감일({date})이 오늘입니다.\n잊지 말고 납부 부탁드립니다.",
            '급여요청': "안녕하세요 사장님!\n급여 대장 확인을 위해 변동 내역을 전달 부탁드립니다.\n{date}까지 부탁드릴게요."
        },
        '부가세': {
            '자료요청': "안녕하세요 사장님, 부가세 신고 기간입니다.\n{date}까지 매출/매입 자료를 부탁드립니다.",
            '납부안내': "안녕하세요 사장님, 부가세 납부서 보내드립니다.\n기한은 {date}까지이오니 확인 바랍니다.",
            '예정고지': "안녕하세요 사장님!\n이번 부가세 예정고지 납부 기한은 {date}입니다."
        }
    };

    function init() {
        const mainTabs = document.getElementById('mainTabs');
        Object.keys(templates).forEach(cat => {
            const btn = document.createElement('div');
            btn.className = `tab-btn ${cat === currentMain ? 'active' : ''}`;
            btn.innerText = cat;
            btn.onclick = () => { currentMain = cat; initSub(); };
            mainTabs.appendChild(btn);
        });
        initSub();
        renderClients();
    }

    function initSub() {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.innerText === currentMain));
        const subArea = document.getElementById('subTabs');
        subArea.innerHTML = '';
        const subs = Object.keys(templates[currentMain]);
        currentSub = subs[0];
        subs.forEach(sub => {
            const btn = document.createElement('button');
            btn.className = `sub-btn ${sub === currentSub ? 'active' : ''}`;
            btn.innerText = sub;
            btn.onclick = () => { currentSub = sub; updateNotice(); };
            subArea.appendChild(btn);
        });
        updateNotice();
    }

    function updateNotice() {
        document.querySelectorAll('.sub-btn').forEach(b => b.classList.toggle('active', b.innerText === currentSub));
        const date = document.getElementById('global-date').value || "____";
        document.getElementById('noticePreview').innerText = templates[currentMain][currentSub].replace("{date}", date);
    }

    function showGlobal() {
        document.getElementById('clientSection').style.display = 'none';
        document.getElementById('globalSection').style.display = 'block';
    }

    function renderClients() {
        const list = document.getElementById('clientList');
        list.innerHTML = "";
        clients.sort((a,b)=>a.name.localeCompare(b.name)).forEach(c => {
            const li = document.createElement('li');
            li.className = 'client-item';
            li.innerText = c.name;
            li.onclick = () => {
                document.getElementById('globalSection').style.display = 'none';
                document.getElementById('clientSection').style.display = 'block';
                document.getElementById('clientTitle').innerText = c.name;
                document.getElementById('clientMemo').value = c.memo || "";
            };
            list.appendChild(li);
        });
    }

    function handleExcelUpload(e) {
        const reader = new FileReader();
        reader.onload = (evt) => {
            const workbook = XLSX.read(new Uint8Array(evt.target.result), {type: 'array'});
            const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
            rows.forEach(r => {
                const name = r['거래처명'] || r['상호'];
                if(name && !clients.find(c => c.name === name.trim())) clients.push({name: name.trim(), memo: ""});
            });
            localStorage.setItem('taxData', JSON.stringify(clients));
            renderClients();
            alert("업체 목록 반영 완료!");
        };
        reader.readAsArrayBuffer(e.target.files[0]);
    }

    function copyMsg(id) {
        navigator.clipboard.writeText(document.getElementById(id).innerText);
        alert("복사되었습니다!");
    }

    init();
</script>
</body>
</html>
