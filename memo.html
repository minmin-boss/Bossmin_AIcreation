<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tax Master Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --sidebar-width: 280px;
            --primary-blue: #2c3e50;
            --accent-gold: #f39c12;
            --bg-light: #f4f7f6;
            --success-green: #27ae60;
        }
        body { font-family: 'Pretendard', sans-serif; display: flex; height: 100vh; margin: 0; background: var(--bg-light); }
        
        /* 사이드바 스타일 */
        #sidebar { width: var(--sidebar-width); background: var(--primary-blue); color: white; display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px; border-bottom: 1px solid #34495e; }
        .btn-container { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        
        button { padding: 10px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-excel { background: var(--success-green); color: white; font-size: 0.8rem; }
        .btn-global-tab { background: #e67e22; color: white; font-size: 0.9rem; margin-top: 5px; }
        
        #clientList { flex: 1; overflow-y: auto; list-style: none; padding: 0; margin: 0; border-top: 1px solid #34495e; }
        .client-item { padding: 12px 20px; border-bottom: 1px solid #34495e; cursor: pointer; font-size: 0.9rem; }
        .client-item:hover { background: #3e5871; }
        .client-item.active { background: var(--accent-gold); }

        /* 메인 콘텐츠 영역 */
        #main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h2 { margin-top: 0; color: var(--primary-blue); border-bottom: 2px solid var(--accent-gold); display: inline-block; padding-bottom: 5px; }

        /* 공지 탭 스타일 */
        .tab-menu { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        .tab-btn { background: #ddd; color: #333; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
        .tab-btn.active { background: var(--primary-blue); color: white; }
        
        .sub-menu { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        .sub-btn { background: #f8f9fa; border: 1px solid #ccc; font-size: 0.85rem; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .sub-btn:hover { background: #e9ecef; }

        .msg-box { background: #eef2f7; padding: 20px; border-radius: 8px; white-space: pre-wrap; margin: 15px 0; border: 1px solid #d1d9e4; line-height: 1.6; }
        .date-input { width: 100%; padding: 12px; border: 2px solid var(--accent-gold); border-radius: 6px; margin-bottom: 15px; font-size: 1rem; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="sidebar-header">
        <div class="btn-container">
            <label for="excelInput" class="btn-excel" style="text-align: center; cursor:pointer; padding:10px; border-radius:6px;">📊 위하고 엑셀 반영</label>
            <input type="file" id="excelInput" accept=".xlsx, .xls" style="display: none;" onchange="handleExcelUpload(event)">
            
            <button class="btn-global-tab" onclick="showGlobalNotice()">📢 전 체 공 지 탭</button>
        </div>
        <h4 style="margin: 10px 0 5px 0; color: #bdc3c7;">업체 개별 관리</h4>
    </div>
    <ul id="clientList"></ul>
</div>

<div id="main-content">
    <!-- 1. 업체 개별 관리 화면 -->
    <div id="clientSection" style="display: none;">
        <h2 id="view-clientName">업체 정보</h2>
        <div class="card">
            <textarea id="edit-memo" rows="3" placeholder="업체 특이사항 입력"></textarea>
            <button class="btn-excel" style="margin-top:10px; width:100%" onclick="updateClientData()">변경내역 저장</button>
        </div>
        <div class="card">
            <h3>개별 문구</h3>
            <div id="individualMsg" class="msg-box"></div>
            <button class="btn-excel" style="width:100%; background:#25d366" onclick="copyText('individualMsg')">카톡 복사</button>
        </div>
    </div>

    <!-- 2. 전체 공지 관리 화면 -->
    <div id="globalSection">
        <h2>📢 전체 공지 대시보드</h2>
        <div class="card">
            <label>📅 날짜/기한 입력</label>
            <input type="text" id="global-date" class="date-input" placeholder="예: 5월 12일(화)" oninput="refreshNotice()">
            
            <div class="tab-menu">
                <div class="tab-btn active" onclick="changeCategory('원천세', this)">원천세</div>
                <div class="tab-btn" onclick="changeCategory('부가세', this)">부가세</div>
                <div class="tab-btn" onclick="changeCategory('법인세', this)">법인세</div>
                <div class="tab-btn" onclick="changeCategory('종소세', this)">종소세</div>
            </div>

            <div id="subMenuArea" class="sub-menu">
                <!-- 자바스크립트에서 세부 탭 생성 -->
            </div>

            <div id="globalPreview" class="msg-box">항목을 선택해 주세요.</div>
            <button class="btn-excel" style="width:100%; background:#e74c3c; font-size:1.1rem; padding:15px;" onclick="copyText('globalPreview')">공지 문구 복사하기</button>
        </div>
    </div>
</div>

<script>
    let clients = JSON.parse(localStorage.getItem('taxClients')) || [];
    let currentCategory = '원천세';
    let currentSubAction = '납부서전달';

    const noticeData = {
        '원천세': {
            '납부서전달': "안녕하세요 사장님, 세무법인입니다.\n이번 달 원천세 납부서를 전달드립니다.\n납부 기한은 {date}까지이오니 확인 부탁드립니다.",
            '마감안내': "안녕하세요 사장님!\n원천세 신고 및 납부 마감일({date})이 다가왔습니다.\n아직 납부 전이시라면 기한 내 납부 부탁드립니다.",
            '급여요청': "안녕하세요 사장님, 급여 신고 안내입니다.\n이번 달 급여 변동 내역을 전달해 주시면 {date}까지 신고 진행하겠습니다."
        },
        '부가세': {
            '자료요청': "안녕하세요 사장님!\n부가세 신고를 위해 매출/매입 자료 준비를 부탁드립니다.\n{date}까지 사무실로 전달해 주시면 감사하겠습니다.",
            '납부서전달': "안녕하세요 사장님, 부가세 납부서를 보내드립니다.\n납부 기한은 {date}까지입니다. 가산세가 발생하지 않도록 유의하세요.",
            '예정고지': "안녕하세요 사장님!\n이번 부가세 예정고지 납부 기한은 {date}까지입니다.\n은행 방문 혹은 가상계좌로 납부 부탁드립니다."
        },
        '법인세': {
            '납부서전달': "안녕하세요 사장님, 법인세 납부서 전달드립니다.\n{date}까지 납부 완료 부탁드립니다.",
            '마감공지': "안녕하세요 사장님! 법인세 신고 마감일은 {date}입니다.\n관련 서류 확인 후 기한 내 납부 바랍니다."
        },
        '종소세': {
            '자료요청': "안녕하세요 사장님! 5월은 종합소득세 신고의 달입니다.\n안내문과 자료를 {date}까지 보내주시면 검토하겠습니다.",
            '결과안내': "안녕하세요 사장님, 종소세 신고 결과입니다.\n납부 기한인 {date}까지 아래 계좌로 납부 부탁드립니다."
        }
    };

    function showGlobalNotice() {
        document.getElementById('clientSection').style.display = 'none';
        document.getElementById('globalSection').style.display = 'block';
        changeCategory('원천세', document.querySelector('.tab-btn'));
    }

    function changeCategory(cat, el) {
        currentCategory = cat;
        // 탭 UI 변경
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        
        // 서부 메뉴 생성
        const subArea = document.getElementById('subMenuArea');
        subArea.innerHTML = '';
        Object.keys(noticeData[cat]).forEach((sub, idx) => {
            const btn = document.createElement('button');
            btn.className = 'sub-btn';
            btn.innerText = sub;
            btn.onclick = () => {
                currentSubAction = sub;
                refreshNotice();
            };
            subArea.appendChild(btn);
            if(idx === 0) currentSubAction = sub; // 첫 번째 메뉴 자동 선택
        });
        refreshNotice();
    }

    function refreshNotice() {
        const date = document.getElementById('global-date').value || "____";
        let text = noticeData[currentCategory][currentSubAction].replace("{date}", date);
        document.getElementById('globalPreview').innerText = text;
    }

    // --- 기존 로직 통합 ---
    function selectClient(id) {
        document.getElementById('globalSection').style.display = 'none';
        document.getElementById('clientSection').style.display = 'block';
        const client = clients.find(c => c.id === id);
        document.getElementById('view-clientName').innerText = client.name;
        document.getElementById('edit-memo').value = client.memo || "";
        document.getElementById('individualMsg').innerText = `안녕하세요 ${client.name} 사장님!`;
        renderList();
    }

    function handleExcelUpload(event) {
        const file = event.target.files[0];
        const reader = new FileReader();
        reader.onload = (e) => {
            const workbook = XLSX.read(new Uint8Array(e.target.result), {type: 'array'});
            const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
            rows.forEach(row => {
                const name = row['거래처명'] || row['상호'];
                if(name && !clients.find(c => c.name === name.trim())) {
                    clients.push({id: Date.now()+Math.random(), name: name.trim(), memo: ""});
                }
            });
            localStorage.setItem('taxClients', JSON.stringify(clients));
            renderList();
            alert("반영 완료!");
        };
        reader.readAsArrayBuffer(file);
    }

    function renderList() {
        const list = document.getElementById('clientList');
        list.innerHTML = "";
        clients.sort((a,b)=>a.name.localeCompare(b.name)).forEach(c => {
            const li = document.createElement('li');
            li.className = 'client-item';
            li.innerText = c.name;
            li.onclick = () => selectClient(c.id);
            list.appendChild(li);
        });
    }

    function copyText(id) {
        navigator.clipboard.writeText(document.getElementById(id).innerText);
        alert("클립보드에 복사되었습니다!");
    }

    renderList();
    showGlobalNotice(); // 첫 시작은 전체 공지 탭
</script>
</body>
</html>
