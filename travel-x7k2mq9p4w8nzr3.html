<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>✈ 내 여행 지도</title>
<!-- Firebase SDK -->
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,collection,doc,setDoc,deleteDoc,onSnapshot,query,where,orderBy}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged,setPersistence,browserLocalPersistence}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const _fc={apiKey:"AIzaSyD9DYsjkHIKJzjhbuIvZwpwGUVvYqo09V8",authDomain:"travel-tracker-9f0f7.firebaseapp.com",projectId:"travel-tracker-9f0f7",storageBucket:"travel-tracker-9f0f7.firebasestorage.app",messagingSenderId:"157327971618",appId:"1:157327971618:web:b5eca73698db54034b817b"};
const _app=initializeApp(_fc);
const _db=getFirestore(_app);
const _auth=getAuth(_app);
const _gp=new GoogleAuthProvider();
try{setPersistence(_auth,browserLocalPersistence);}catch(e){console.warn('Auth persistence 설정 실패 (브라우저 제약일 수 있음):',e);}
let _unsub=null;
onAuthStateChanged(_auth,user=>{
if(user){
window._user=user;
const ls=document.getElementById('lockScreen');if(ls)ls.style.display='none';
window._updateUserUI&&window._updateUserUI(user);
_startListen(user.uid);
if(!window._appReady)window._bootApp&&window._bootApp();
}else{
window._user=null;
window._migrating=false;
const ls=document.getElementById('lockScreen');if(ls)ls.style.display='flex';
if(_unsub){_unsub();_unsub=null;}
// 주의: 여기서 trips를 강제로 비우지 않습니다.
// (로그인 세션이 일시적으로 안 풀린 것일 수도 있는데, 그때마다 화면 데이터를 지워버리면
//  "새로고침하면 데이터가 사라진다"는 문제가 생깁니다. 로컬 캐시는 그대로 유지하고
//  명시적으로 로그아웃 버튼을 눌렀을 때만 _logout()에서 캐시를 지웁니다.)
}
});
function _startListen(uid){
if(_unsub){_unsub();_unsub=null;}
const q=query(collection(_db,'travel_trips'),where('uid','==',uid),orderBy('createdAt','asc'));
_unsub=onSnapshot(q,snap=>{
window._fbData=[];
snap.forEach(d=>window._fbData.push({_fbId:d.id,...d.data()}));
// ⚠️ 버그 수정: 예전에는 "클라우드가 완전히 비어있을 때 딱 한 번만" 로컬 데이터를
// 업로드했습니다. 그래서 일부 여행 기록만 클라우드에 저장되고 나머지는 로컬에만
// 남아있는 상태에서(예: 예전에 마이그레이션이 한 번 실행된 뒤 추가된 기록, 또는
// 실패한 항목), 이후 아무 스냅샷이나 한 번 더 오면 그 "로컬에만 있던" 기록들이
// 화면과 캐시에서 통째로 사라지는 문제가 있었습니다.
// 이제는 스냅샷을 받을 때마다 "로컬에는 있는데 클라우드엔 아직 없는 기록"이 있는지
// 매번 확인해서, 있으면 그 부분만 자동으로 클라우드에 채워 넣습니다.
const localTrips=window.trips&&window.trips.length?window.trips:(typeof _loadLocalCache==='function'?_loadLocalCache():null);
if(localTrips&&localTrips.length){
const cloudIds=new Set(window._fbData.map(d=>d._fbId));
const missing=localTrips.filter(t=>!t._fbId||!cloudIds.has(t._fbId));
if(missing.length&&!window._migrating){
window._migrating=true;
if(typeof window._migrateLocalTrips==='function'){
window._migrateLocalTrips(uid,missing).finally(()=>{
window._migrating=false;
// 마이그레이션이 끝난 뒤 추가 스냅샷이 바로 오지 않는 경우에도
// 화면이 예전 상태로 멈춰있지 않도록, 끝나자마자 한 번 더 최신 상태를 직접 반영합니다.
if(window._appReady&&window._render&&!window._saving&&window._fbData){
trips=window._fbData;window.trips=trips;window._render();
}
});
}
return; // 누락분을 다 올리기 전까지는 이번 스냅샷으로 화면을 덮어쓰지 않음
}
if(window._migrating)return; // 업로드 진행 중에는 중간 상태로 덮어쓰지 않음
}
if(window._appReady&&window._render&&!window._saving){
trips=window._fbData;window.trips=trips;window._render();
}
window._fbReady=true;
},err=>{
console.error('Firestore 읽기 실패:',err);
window._fbError=err;
if(typeof window.toast==='function')window.toast('⚠️ 데이터 불러오기 실패: '+(err.code||err.message));
setTimeout(()=>alert('⚠️ Firestore 데이터를 불러오지 못했습니다.\n오류: '+(err.code||err.message)+'\n\nFirebase 콘솔에서 보안 규칙(Rules) 또는 인덱스 설정을 확인해주세요.\n(콘솔에 인덱스 생성 링크가 떴다면 그 링크를 클릭하면 자동 생성됩니다)'),300);
});
}
window._googleLogin=async function(){
const btn=document.getElementById('googleBtn');
if(btn){btn.disabled=true;btn.textContent='로그인 중...';}
try{await signInWithPopup(_auth,_gp);}
catch(e){
const err=document.getElementById('lockErr');
if(err)err.textContent=e.code==='auth/popup-closed-by-user'?'로그인 창이 닫혔습니다.':'로그인 실패: '+e.message;
if(btn){btn.disabled=false;btn.textContent='Google로 로그인';}
}
};
window._logout=async function(){if(!confirm('로그아웃 하시겠어요?\n(저장된 여행 기록은 클라우드에 남아있고, 이 기기의 임시 캐시만 정리됩니다)'))return;try{localStorage.removeItem('travel_map_trips_cache_v1');}catch(e){}await signOut(_auth);};
window._fbSave=async function(entry){
if(!entry._fbId){
// 방어 코드: _fbId가 없는 채로 저장하면 doc(_db,'travel_trips',undefined)가
// 되어 실제로는 이름이 "undefined"인 문서 하나에 여러 여행 기록이 겹쳐
// 저장되는 심각한 데이터 유실 버그로 이어집니다. 여기서 미리 막습니다.
console.error('_fbSave 호출 실패: _fbId가 없는 entry는 저장할 수 없습니다.', entry);
throw new Error('_fbId 없음 - 저장 취소됨');
}
const ref=doc(_db,'travel_trips',entry._fbId);
await setDoc(ref,entry,{merge:true});
};
window._fbDel=async function(fbId){
await deleteDoc(doc(_db,'travel_trips',fbId));
};
window._fbClear=async function(allTrips){
for(const t of allTrips){
if(t._fbId)await deleteDoc(doc(_db,'travel_trips',t._fbId));
}
};
const COL='traveltrips';
</script>
<style>

function projX(lon){const sh=lon-155;return((sh<-180?sh+360:sh>180?sh-360:sh)+180)/360*1000;}
function projY(lat){lat=Math.max(Math.min(lat,85),-85);const r=lat*Math.PI/180,m=Math.log(Math.tan(Math.PI/4+r/2)),t=Math.log(Math.tan(Math.PI/4+85*Math.PI/360));return(1-(m+t)/(2*t))*500;}

function _drParseOneDate(s){
s=s.trim();
const m=s.match(/^(\d{4})\s*[.\-\/]\s*(\d{1,2})\s*[.\-\/]\s*(\d{1,2})$/);
if(!m)return null;
const y=+m[1],mo=+m[2]-1,d=+m[3];
const dt=new Date(y,mo,d);
if(dt.getFullYear()!==y||dt.getMonth()!==mo||dt.getDate()!==d)return null;
return dt;
}
function _drParseRangeText(str){
if(!str||!str.trim())return null;
const segs=str.split('~').map(s=>s.trim()).filter(Boolean);
if(!segs.length)return null;
const a=_drParseOneDate(segs[0]);
if(!a)return null;
if(segs.length===1)return{start:a,end:a};
const b=_drParseOneDate(segs[1]);
if(!b)return null;
return a<=b?{start:a,end:b}:{start:b,end:a};
}

function formatCostInput(el){
const raw=el.value.replace(/[^0-9]/g,''); // 숫자만 남김
if(!raw){el.value='';return;}
const prevLen=el.value.length;
const prevPos=el.selectionStart||prevLen;
const digitsBeforeCursor=el.value.slice(0,prevPos).replace(/[^0-9]/g,'').length;
const formatted=Number(raw).toLocaleString('ko-KR');
el.value=formatted;
// 커서 위치를 콤마 삽입 이후에도 자연스럽게 유지
let count=0,pos=formatted.length;
for(let i=0;i<formatted.length;i++){
if(/[0-9]/.test(formatted[i]))count++;
if(count===digitsBeforeCursor){pos=i+1;break;}
}
el.setSelectionRange(pos,pos);
}

el.setSelectionRange(el.value.length,el.value.length);
}

function uploadPhoto(inp){
if(!inp.files[0])return;
const file=inp.files[0];
const r=new FileReader();
r.onload=e=>{
const img=new Image();
img.onload=()=>{
// 긴 변 기준 1024px로 리사이즈 + JPEG 압축으로 Firestore 문서 용량(1MB) 제한 대응
const MAX=1024;
let{width:w,height:h}=img;
if(w>h&&w>MAX){h=Math.round(h*MAX/w);w=MAX;}
else if(h>=w&&h>MAX){w=Math.round(w*MAX/h);h=MAX;}
const canvas=document.createElement('canvas');
canvas.width=w;canvas.height=h;
canvas.getContext('2d').drawImage(img,0,0,w,h);
let quality=0.82;
let dataUrl=canvas.toDataURL('image/jpeg',quality);
// 그래도 크면 품질을 더 낮춰가며 재압축 (최대 ~700KB 목표)
while(dataUrl.length>700000&&quality>0.35){quality-=0.1;dataUrl=canvas.toDataURL('image/jpeg',quality);}
if(dataUrl.length>900000){toast('⚠️ 사진이 너무 커서 저장이 안 될 수 있어요. 더 작은 사진을 권장합니다');}
window._tmpPhoto=dataUrl;
let wrap=document.querySelector('.modal-img-wrap');
const label=document.querySelector('.photo-upload-btn');
if(!wrap){wrap=document.createElement('div');wrap.className='modal-img-wrap';label.before(wrap);}
wrap.innerHTML=`<img src="${dataUrl}" alt=""><button class="modal-img-del" onclick="removePhoto()">✕</button>`;
};
img.src=e.target.result;
};
r.readAsDataURL(file);
}

function haversine(a,b,c,d){const R=6371,dL=(c-a)*Math.PI/180,dO=(d-b)*Math.PI/180;const x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dO/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function heatColor(v,mx){const t=Math.min(v/Math.max(mx,1),1);const lc=(c1,c2,t)=>{const h=s=>parseInt(s,16);const[r1,g1,b1]=[h(c1.slice(1,3)),h(c1.slice(3,5)),h(c1.slice(5,7))];const[r2,g2,b2]=[h(c2.slice(1,3)),h(c2.slice(3,5)),h(c2.slice(5,7))];return`rgb(${Math.round(r1+(r2-r1)*t)},${Math.round(g1+(g2-g1)*t)},${Math.round(b1+(b2-b1)*t)})`;};return t<0.33?lc('#d4e8c2','#f0c040',t/0.33):lc('#f0c040','#e8435a',(t-0.33)/0.67);}

Object.entries(visitMap).forEach(([en,v])=>{const ll=Object.entries(AP_LATLON).find(([k])=>BY_EN[en]&&k);if(!ll)return;const c=BY_EN[en];if(!c)return;const ap=Object.entries(AP_LATLON).find(([k])=>c.cities.includes(k));if(!ap)return;const x=projX(ap[1][1]),y=projY(ap[1][0]);pHTML+=`<circle cx="${x}" cy="${y}" r="7" fill="rgba(255,255,255,.85)" stroke="rgba(0,0,0,.2)" stroke-width=".5"/><text x="${x}" y="${y+3.5}" text-anchor="middle" font-size="8" font-weight="800" fill="#2c3e50" font-family="var(--f)">${v}</text>`;});

// ── 대권항로 보간 (great-circle slerp) ──
function _gcInterp(lat1,lon1,lat2,lon2,t){
const R=Math.PI/180,D=180/Math.PI;
const phi1=lat1*R,lam1=lon1*R,phi2=lat2*R,lam2=lon2*R;
const d=Math.acos(Math.max(-1,Math.min(1,Math.sin(phi1)*Math.sin(phi2)+Math.cos(phi1)*Math.cos(phi2)*Math.cos(lam2-lam1))));
if(d<0.0001)return{lat:lat2,lon:lon2};
const A=Math.sin((1-t)*d)/Math.sin(d),B=Math.sin(t*d)/Math.sin(d);
const x=A*Math.cos(phi1)*Math.cos(lam1)+B*Math.cos(phi2)*Math.cos(lam2);
const y=A*Math.cos(phi1)*Math.sin(lam1)+B*Math.cos(phi2)*Math.sin(lam2);
const z=A*Math.sin(phi1)+B*Math.sin(phi2);
return{lat:Math.atan2(z,Math.sqrt(x*x+y*y))*D,lon:Math.atan2(y,x)*D};
}
function _easeInOutQuad(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
function _latLonToVec3(lat,lon,radius){
const phi=(90-lat)*Math.PI/180;
const theta=(lon+180)*Math.PI/180;
return new THREE.Vector3(
-radius*Math.sin(phi)*Math.cos(theta),
radius*Math.cos(phi),
radius*Math.sin(phi)*Math.sin(theta)
);
}

function _onGlobeResize(){

function _addStarfield(){

for(let i=0;i<cnt;i++){

const th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);
pos[i*3]=r*Math.sin(ph)*Math.cos(th);

const geo=new THREE.BufferGeometry();
geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
const mat=new THREE.PointsMaterial({color:0xffffff,size:1.4,sizeAttenuation:true});
_glScene.add(new THREE.Points(geo,mat));
}
// ── 핀 (DOM 오버레이, 국기 표시) ──
function _clearGlobePins(){
_glPins.forEach(p=>p.el.remove());
_glPins=[];

function _addGlobePin(lat,lon,flag,title,isHome){
const container=document.getElementById('globeDiv');
if(!container)return;
const pos=_latLonToVec3(lat,lon,GLOBE_RADIUS*1.012);
const el=document.createElement('div');
el.className='gl-pin'+(isHome?' gl-pin-home':'');
el.title=title;
el.innerHTML=`<div class="gl-pin-circle">${flagImg(flag,isHome?18:14)}</div>`;
container.appendChild(el);
_glPins.push({el,pos});
}
// ── 도착 펄스 이펙트 ──
function _pulsePinAt(lat,lon){
const target=_latLonToVec3(lat,lon,GLOBE_RADIUS*1.012);
let best=null,bestD=Infinity;
_glPins.forEach(p=>{const d=p.pos.distanceTo(target);if(d<bestD){bestD=d;best=p;}});
if(best&&bestD<8){
best.el.classList.remove('gl-pin-pulse');
void best.el.offsetWidth; // 리플로우 강제 → 애니메이션 재시작
best.el.classList.add('gl-pin-pulse');
setTimeout(()=>best.el.classList.remove('gl-pin-pulse'),700);
}
}
function renderGlobePins(){
if(!_glScene)return;
_glCompletedLines.forEach(l=>{_glScene.remove(l);l.geometry.dispose();});
_glCompletedLines=[];
_clearGlobePins();
_addGlobePin(SEOUL_LAT,SEOUL_LON,'🇰🇷','🇰🇷 서울 (인천) — 홈',true);
const ordered=chronoTrips();
ordered.forEach(t=>{
const ll=_getGlobeLL(t);if(!ll)return;
_addGlobePin(ll[0],ll[1],t.flag||'🌍',`${t.flag||'🌍'} ${t.city||t.cntry}${t.df?' ('+t.df+')':''}`,false);
});
const el=document.getElementById('globeStatus');
if(el)el.textContent=`🇰🇷 서울 출발 · ${ordered.length}개 도시`;
}
function _updatePinPositions(){
if(!_glCamera)return;
const container=document.getElementById('globeDiv');
const w=container.clientWidth,h=container.clientHeight;
const camDir=new THREE.Vector3();
_glPins.forEach(p=>{
const normal=p.pos.clone().normalize();
camDir.copy(_glCamera.position).sub(p.pos).normalize();
if(normal.dot(camDir)<0.04){p.el.style.display='none';return;}
const v=p.pos.clone().project(_glCamera);
if(v.z>1){p.el.style.display='none';return;}
p.el.style.display='block';
p.el.style.left=((v.x*0.5+0.5)*w)+'px';
p.el.style.top=((-v.y*0.5+0.5)*h)+'px';
});
}
function _buildArcPoints(fromLat,fromLon,toLat,toLon,segments,tEnd){
const pts=[];
const n=Math.max(2,Math.round(segments*tEnd));
for(let i=0;i<=n;i++){
const tt=(i/segments);
const {lat,lon}=_gcInterp(fromLat,fromLon,toLat,toLon,tt);
const altBoost=1+Math.sin(Math.PI*Math.min(tt,tEnd))*0.22;
pts.push(_latLonToVec3(lat,lon,GLOBE_RADIUS*altBoost));
}
return pts;
}
function _addCompletedArc(fromLat,fromLon,toLat,toLon){
const pts=_buildArcPoints(fromLat,fromLon,toLat,toLon,60,1);
const geo=new THREE.BufferGeometry().setFromPoints(pts);
const mat=new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.55});
const line=new THREE.Line(geo,mat);
_glScene.add(line);
_glCompletedLines.push(line);
}
// 현재 비행 경로선(_glCurArcLine) 갱신 — geometry를 새로 만들지 않고 버퍼만 갱신
function _updateArcLine(pts){
const arr=_arcPositions;
const n=Math.min(pts.length,ARC_MAX_SEG+1);
for(let i=0;i<n;i++){
arr[i*3]=pts[i].x;arr[i*3+1]=pts[i].y;arr[i*3+2]=pts[i].z;
}
const posAttr=_glCurArcLine.geometry.getAttribute('position');
posAttr.needsUpdate=true;
_glCurArcLine.geometry.setDrawRange(0,n);
}
function _clearArcLine(){
_glCurArcLine.geometry.setDrawRange(0,0);
}
// ── 메인 애니메이션 루프 ──
function _animateGlobe(){
_glRafId=requestAnimationFrame(_animateGlobe);
if(_glClouds)_glClouds.rotation.y+=0.0004;
if(_glFlightState){
const now=performance.now();
const elapsed=now-_glFlightState.start;
const t=Math.min(elapsed/_glFlightState.duration,1);
const et=_easeInOutQuad(t);
const {lat,lon}=_gcInterp(_glFlightState.fromLat,_glFlightState.fromLon,_glFlightState.toLat,_glFlightState.toLon,et);
const altBoost=1+Math.sin(Math.PI*et)*0.22;
const curPos=_latLonToVec3(lat,lon,GLOBE_RADIUS*altBoost);
_glFlightState.curPos=curPos;
_glFlightState.curT=et;
// 카메라가 비행기를 계속 따라가도록 부드럽게 추적 (시네마틱 이즈) + 비행 중간엔 살짝 위에서 내려다보는 틸트
const liftFactor=Math.sin(Math.PI*et); // 0(출발/도착) → 1(중간)
const baseDir=curPos.clone().normalize();
const tiltDir=baseDir.clone().add(new THREE.Vector3(0,0.32*liftFactor,0)).normalize();
const camDist=GLOBE_CAM_DIST+liftFactor*38;
const desired=tiltDir.multiplyScalar(camDist);
_glCamera.position.lerp(desired,0.045);
_glCamera.up.set(0,1,0);
_glCamera.lookAt(0,0,0);
// 노란 경로선 갱신
const pts=_buildArcPoints(_glFlightState.fromLat,_glFlightState.fromLon,_glFlightState.toLat,_glFlightState.toLon,60,et);
if(pts.length>1)_updateArcLine(pts);
if(t>=1){
_addCompletedArc(_glFlightState.fromLat,_glFlightState.fromLon,_glFlightState.toLat,_glFlightState.toLon);
_clearArcLine();
_pulsePinAt(_glFlightState.toLat,_glFlightState.toLon);
const cb=_glFlightState.onDone;
_glFlightState=null;
if(cb)setTimeout(cb,260);
}
}else{
_glIdleAngle+=0.0012;
const homeNorm=_latLonToVec3(SEOUL_LAT,SEOUL_LON,1);
const idlePos=new THREE.Vector3(
homeNorm.x*Math.cos(_glIdleAngle)-homeNorm.z*Math.sin(_glIdleAngle),
homeNorm.y,
homeNorm.x*Math.sin(_glIdleAngle)+homeNorm.z*Math.cos(_glIdleAngle)
).normalize().multiplyScalar(GLOBE_CAM_DIST);
_glCamera.position.lerp(idlePos,0.02);
_glCamera.lookAt(0,0,0);
}
_glRenderer.render(_glScene,_glCamera);
_updatePinPositions();
_updatePlaneEl();
}
function _updatePlaneEl(){
if(!_glPlaneEl)return;
if(!_glFlightState||!_glFlightState.curPos){_glPlaneEl.style.display='none';return;}
const container=document.getElementById('globeDiv');
const w=container.clientWidth,h=container.clientHeight;
const v=_glFlightState.curPos.clone().project(_glCamera);
if(v.z>1){_glPlaneEl.style.display='none';return;}
const x=(v.x*0.5+0.5)*w, y=(-v.y*0.5+0.5)*h;
_glPlaneEl.style.display='block';
_glPlaneEl.style.left=x+'px';
_glPlaneEl.style.top=y+'px';
// 진행 방향(살짝 앞선 지점)을 화면에 투영해 비행 방향 각도를 구하고, 비행기 머리가 그쪽을 향하도록 회전
const fs=_glFlightState;
const lookT=Math.min(fs.curT+0.02,1);
const {lat:nLat,lon:nLon}=_gcInterp(fs.fromLat,fs.fromLon,fs.toLat,fs.toLon,lookT);
const nAlt=1+Math.sin(Math.PI*lookT)*0.22;
const nextPos=_latLonToVec3(nLat,nLon,GLOBE_RADIUS*nAlt);
const nv=nextPos.project(_glCamera);
const nx=(nv.x*0.5+0.5)*w, ny=(-nv.y*0.5+0.5)*h;
const dx=nx-x, dy=ny-y;
if(Math.hypot(dx,dy)>0.4){
const angleDeg=Math.atan2(dy,dx)*180/Math.PI;
// ✈️ 이모지는 기본적으로 오른쪽 위(약 45°)를 향하고 있어 그만큼 보정
_glPlaneEl.style.transform=`translate(-50%,-50%) rotate(${angleDeg+45}deg)`;
}
}
// ── 비행 한 구간 시작 ──
function _globeFlyTo(fromLat,fromLon,toLat,toLon,label,onDone){
if(label){const el=document.getElementById('globeStatus');if(el)el.textContent=label;}
_glFlightState={fromLat,fromLon,toLat,toLon,start:performance.now(),duration:2600,onDone};
}
function _getOrdered(){
const o=chronoTrips().filter(t=>t.df||t.dt);
return o.length?o:chronoTrips();
}
// ── 순서대로 비행 (날짜순) — 서울 ↔ 각 도시 왕복 방식 ──
// ⚠️ 예전에는 서울→도시1→도시2→도시3...→서울 순으로 도시끼리 바로 이어서 날아가서,
// 서로 관련 없는 두 도시 사이에 긴 대권항로 선이 지구본을 가로질러 지나가며
// 지저분하고 이상하게 겹쳐 보였습니다.
// 이제는 매번 "서울 → 목적지 → 서울" 왕복으로 날아가고, 한 왕복이 끝나면 그 선을
// 깨끗이 지운 뒤 다음 목적지로 넘어가도록 바꿔서 항상 선이 하나(또는 둘: 갈 때/올 때)만
// 보이고, 화면이 훨씬 깔끔하고 예측 가능하게 동작합니다.
function _flyNext(){
if(!_glPlaying)return;
const ordered=_getOrdered();
if(!ordered.length)return;
if(_glAutoIdx>=ordered.length){
// 모든 여행지 왕복 완료 — 자동 재생 종료
_glPlaying=false;
const btn=document.getElementById('globePlayBtn');const ico=document.getElementById('globePlayIco');const txt=document.getElementById('globePlayTxt');
if(btn)btn.classList.remove('playing');if(ico)ico.textContent='▶';if(txt)txt.textContent='자동 비행';
document.getElementById('globeStatus').textContent='🇰🇷 서울(인천) 도착 — 모든 여행지 왕복 완료! ✅';
return;
}
const t=ordered[_glAutoIdx];
const ll=_getGlobeLL(t);
if(!ll){_glAutoIdx++;setTimeout(_flyNext,50);return;}
const label=`✈️ ${t.flag||''} ${t.city||t.cntry}${t.df?' — '+t.df:''}`;
// 1) 서울 → 목적지
_globeFlyTo(SEOUL_LAT,SEOUL_LON,ll[0],ll[1],label+' 로 출발',()=>{
if(!_glPlaying)return;
// 목적지에 잠깐 머무는 딜레이
setTimeout(()=>{
if(!_glPlaying)return;
// 2) 목적지 → 서울 (귀환)
_globeFlyTo(ll[0],ll[1],SEOUL_LAT,SEOUL_LON,'🇰🇷 서울(인천)으로 귀환 중...',()=>{
if(!_glPlaying)return;
// 다음 목적지로 넘어가기 전, 이번 왕복 경로선을 깨끗이 정리
_glCompletedLines.forEach(l=>{_glScene.remove(l);l.geometry.dispose();});
_glCompletedLines=[];
_glAutoIdx++;
setTimeout(_flyNext,500);
});
},650);
});
}
function globeTogglePlay(){
if(!_glScene){initGlobe();setTimeout(globeTogglePlay,600);return;}
_glPlaying=!_glPlaying;
const btn=document.getElementById('globePlayBtn');
const ico=document.getElementById('globePlayIco');
const txt=document.getElementById('globePlayTxt');
if(_glPlaying){
btn.classList.add('playing');
if(ico)ico.textContent='⏸';if(txt)txt.textContent='정지';
_glAutoIdx=0;
_glCompletedLines.forEach(l=>{_glScene.remove(l);l.geometry.dispose();});
_glCompletedLines=[];
document.getElementById('globeStatus').textContent='🇰🇷 서울(인천) 출발!';
setTimeout(_flyNext,400);
}else{
btn.classList.remove('playing');
if(ico)ico.textContent='▶';if(txt)txt.textContent='자동 비행';
_glFlightState=null;
}
}
function globeReset(){
_glPlaying=false;
const btn=document.getElementById('globePlayBtn');const ico=document.getElementById('globePlayIco');const txt=document.getElementById('globePlayTxt');
if(btn)btn.classList.remove('playing');if(ico)ico.textContent='▶';if(txt)txt.textContent='자동 비행';
_glFlightState=null;
_glAutoIdx=0;
if(_glScene){
_glCompletedLines.forEach(l=>{_glScene.remove(l);l.geometry.dispose();});
_glCompletedLines=[];
if(_glCurArcLine)_clearArcLine();
}
document.getElementById('globeStatus').textContent='🇰🇷 서울(인천) 대기 — ▶ 자동 비행!';
setTimeout(renderGlobePins,200);
}
// ── 보호 ──
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if(e.keyCode===123||(e.ctrlKey&&e.shiftKey&&[73,74,67].includes(e.keyCode))||(e.ctrlKey&&[85,83].includes(e.keyCode)))e.preventDefault();});
// ── 부팅 ──
const td=new Date().toISOString().split('T')[0];
document.getElementById('df').value=td;document.getElementById('dt').value=td;
_drResetToToday();
setTimeout(()=>{if(!window._appReady)_doBootApp();},900);
document.getElementById('cntryIn').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('cityIn').focus();});

const wm=document.createElement('div');
wm.style.cssText='position:fixed;right:16px;bottom:14px;font-size:10px;font-weight:300;color:#c8c8c8;opacity:.25;letter-spacing:1.5px;z-index:9999;pointer-events:none;user-select:none;font-family:sans-serif';
wm.textContent='boss_min_';document.body.appendChild(wm);
</script>
