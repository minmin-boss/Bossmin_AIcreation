<title>✈ 내 여행 지도</title>
<!-- Firebase SDK -->
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,collection,doc,setDoc,deleteDoc,onSnapshot,query,where,orderBy}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const _fc={apiKey:"AIzaSyD9DYsjkHIKJzjhbuIvZwpwGUVvYqo09V8",authDomain:"travel-tracker-9f0f7.firebaseapp.com",projectId:"travel-tracker-9f0f7",storageBucket:"travel-tracker-9f0f7.firebasestorage.app",messagingSenderId:"157327971618",appId:"1:157327971618:web:b5eca73698db54034b817b"};
const _app=initializeApp(_fc);
const _db=getFirestore(_app);
const _auth=getAuth(_app);
const _gp=new GoogleAuthProvider();
let _unsub=null;
onAuthStateChanged(_auth,user=>{
if(user){
window._user=user;
const ls=document.getElementById('lockScreen');if(ls)ls.style.display='none';
window._updateUserUI&&window._updateUserUI(user);
_startListen(user.uid);
if(!window._appReady)window._bootApp&&window._bootApp();
}else{
window._user=null;
const ls=document.getElementById('lockScreen');if(ls)ls.style.display='flex';
if(_unsub){_unsub();_unsub=null;}
window._fbData=[];trips=[];window.trips=[];
if(window._appReady&&window._render)window._render();
}
});
function _startListen(uid){
if(_unsub){_unsub();_unsub=null;}
const q=query(collection(_db,'travel_trips'),where('uid','==',uid),orderBy('createdAt','asc'));
_unsub=onSnapshot(q,snap=>{
window._fbData=[];
snap.forEach(d=>window._fbData.push({_fbId:d.id,...d.data()}));
if(window._appReady&&window._render&&!window._saving){
trips=window._fbData;window.trips=trips;window._render();
}
});
}
window._googleLogin=async function(){
const btn=document.getElementById('googleBtn');
if(btn){btn.disabled=true;btn.textContent='로그인 중...';}
try{await signInWithPopup(_auth,_gp);}
catch(e){
const err=document.getElementById('lockErr');
if(err)err.textContent=e.code==='auth/popup-closed-by-user'?'로그인 창이 닫혔습니다.':'로그인 실패: '+e.message;
if(btn){btn.disabled=false;btn.textContent='Google로 로그인';}
}
};
window._logout=async function(){if(!confirm('로그아웃 하시겠어요?'))return;await signOut(_auth);};
window._fbSave=async function(entry){
const ref=doc(_db,'travel_trips',entry._fbId);
await setDoc(ref,entry,{merge:true});
};
window._fbDel=async function(fbId){
await deleteDoc(doc(_db,'travel_trips',fbId));
};
window._fbClear=async function(allTrips){
for(const t of allTrips){
if(t._fbId)await deleteDoc(doc(_db,'travel_trips',t._fbId));
}
};
</script>
<style>
*,::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ── Header ── */

.bar-wrap{display:flex;flex-direction:column;gap:7px}
.bar-row{display:flex;align-items:center;gap:8px}
.bar-lbl{font-size:11px;color:var(--text);width:70px;flex-shrink:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:10px;background:var(--bg2);border-radius:5px;overflow:hidden}
.bar-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .6s}
.bar-cnt{font-size:10px;color:var(--text2);width:24px;text-align:right;font-weight:700}
.trend-wrap{display:flex;align-items:flex-end;gap:6px;height:80px;padding-bottom:4px}
.trend-col{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1}
.trend-bar{width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--accent),var(--accent2));min-height:4px;transition:height .6s}
.trend-lbl{font-size:9px;color:var(--text2);font-weight:700;text-align:center}
.trend-val{font-size:9px;color:var(--accent);font-weight:800}
.city-list{display:flex;flex-direction:column;gap:6px}
.city-row{display:flex;align-items:center;gap:8px}
.city-rank{font-size:10px;font-weight:800;color:var(--text3);width:14px}
.city-name{font-size:11px;font-weight:700;color:var(--text);flex:1}
.city-cnt{font-size:10px;color:var(--text2);background:var(--bg2);padding:1px 7px;border-radius:10px;font-weight:700}
.cont-list{display:flex;flex-direction:column;gap:5px}
.cont-row{display:flex;align-items:center;gap:8px}
.cont-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.cont-name{font-size:11px;font-weight:700;color:var(--text);flex:1}
.cont-pct{font-size:10px;color:var(--text2);font-weight:700}
.cont-bar-track{flex:2;height:6px;background:var(--bg2);border-radius:3px;overflow:hidden}
.cont-bar-fill{height:100%;border-radius:3px;transition:width .6s}
.hmap-outer{width:100%;background:var(--ocean);border-radius:10px;overflow:hidden}
.hmap-outer svg{display:block;width:100%;height:auto}
.hm-country{fill:var(--land);stroke:#b8d4a0;stroke-width:.25px}
.hmap-legend{display:flex;align-items:center;gap:6px;margin-top:8px;justify-content:flex-end}
.hmap-grad{width:80px;height:8px;border-radius:4px;background:linear-gradient(90deg,#d4e8c2,#f0c040,#e8435a)}
.hmap-lbl{font-size:9px;color:var(--text2)}
/* ── Toast ── */
#toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(120px);background:var(--accent);color:white;font-family:var(--f);font-size:12px;font-weight:800;padding:10px 20px;border-radius:9px;z-index:300;transition:transform .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none;box-shadow:0 4px 16px rgba(58,123,213,.4)}
#toast.show{transform:translateX(-50%) translateY(0)}
/* Protection */
body{-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
@media(max-width:680px){
.row3{grid-template-columns:1fr 1fr}
.row-btn{grid-template-columns:1fr 1fr}
.btn-add{grid-column:1/-1}
.stats{gap:.6rem}
h1{font-size:18px}
.stat{padding:6px 12px}
}

function chronoTrips(){return[...trips].map((t,i)=>({...t,_i:i})).sort((a,b)=>(a.df||a.dt||'9999').localeCompare(b.df||b.dt||'9999'));}

function initGlobe(){
  if(_globeInited){renderGlobePins();return;}
  _globeInited=true;
  const scripts=['https://cdn.amcharts.com/lib/5/index.js','https://cdn.amcharts.com/lib/5/map.js','https://cdn.amcharts.com/lib/5/geodata/worldLow.js','https://cdn.amcharts.com/lib/5/themes/Animated.js'];
  let loaded=0;
  scripts.forEach(src=>{
    const s=document.createElement('script');
    s.src=src;
    s.onload=()=>{loaded++;if(loaded===scripts.length)_buildGlobe();};
    document.head.appendChild(s);
  });
}

function _buildGlobe(){
  const am5=window.am5, am5map=window.am5map, am5themes_Animated=window.am5themes_Animated;
  if(!am5||!am5map)return;
  if(_globeRoot){try{_globeRoot.dispose();}catch(e){}_globeRoot=null;}

  _globeRoot=am5.Root.new('globeDiv');
  _globeRoot.setThemes([am5themes_Animated.new(_globeRoot)]);

  _globeChart=_globeRoot.container.children.push(am5map.MapChart.new(_globeRoot,{
    panX:'rotateX',panY:'rotateY',
    projection:am5map.geoOrthographic(),
    rotateX:-SEOUL_LON,rotateY:-SEOUL_LAT*0.5
  }));

  const bg=_globeChart.series.push(am5map.MapPolygonSeries.new(_globeRoot,{}));
  bg.mapPolygons.template.setAll({fill:am5.color(0x4db8e8),strokeWidth:0});
  bg.data.push({geometry:am5map.getGeoRectangle(90,180,-90,-180)});

  const poly=_globeChart.series.push(am5map.MapPolygonSeries.new(_globeRoot,{geoJSON:window.am5geodata_worldLow,exclude:['AQ']}));
  poly.mapPolygons.template.setAll({fill:am5.color(0x3ab56e),stroke:am5.color(0x2d8a55),strokeWidth:0.5,tooltipText:'{name}'});
  poly.mapPolygons.template.states.create('hover',{fill:am5.color(0x5ac87a)});

  poly.events.on('datavalidated',()=>{
    const visited=new Set(trips.map(t=>{const c=BY_KO[t.cntry]||BY_EN[t.cntryEn];return c?_ISO[c.en]:'';}).filter(Boolean));
    poly.mapPolygons.each(p=>{
      const id=(p.dataItem?.get('id')||'').toLowerCase();
      if(id==='kr'){p.set('fill',am5.color(0x3a7bd5));p.set('stroke',am5.color(0x2d6abf));p.set('strokeWidth',2);}
      else if(visited.has(id)){p.set('fill',am5.color(0xf0c040));p.set('stroke',am5.color(0xd4a820));p.set('strokeWidth',1);}
    });
  });

  window._gDoneLine=_globeChart.series.push(am5map.MapLineSeries.new(_globeRoot,{}));
  window._gDoneLine.mapLines.template.setAll({stroke:am5.color(0xffffff),strokeWidth:1.5,strokeOpacity:0.5,strokeDasharray:[4,5]});

  window._gCurLine=_globeChart.series.push(am5map.MapLineSeries.new(_globeRoot,{}));
  window._gCurLine.mapLines.template.setAll({stroke:am5.color(0xffcc00),strokeWidth:2.5,strokeOpacity:1,strokeDasharray:[5,4]});

  const pins=_globeChart.series.push(am5map.MapPointSeries.new(_globeRoot,{}));
  pins.bullets.push((r,s,di)=>{
    const isHome=di.dataContext?.isHome;
    const c=am5.Circle.new(r,{radius:isHome?9:5,fill:am5.color(isHome?0x3a7bd5:0xff4060),stroke:am5.color(isHome?0x60a5fa:0xff8096),strokeWidth:2.5,tooltipText:'{title}'});
    c.states.create('hover',{scale:1.5});
    return am5.Bullet.new(r,{sprite:c});
  });
  window._gPins=pins;

  const plane=_globeChart.series.push(am5map.MapPointSeries.new(_globeRoot,{}));
  plane.bullets.push(()=>{
    const lbl=am5.Label.new(_globeRoot,{text:'✈️',fontSize:24,centerX:am5.p50,centerY:am5.p50});
    return am5.Bullet.new(_globeRoot,{sprite:lbl});
  });
  window._gPlane=plane;

  setTimeout(()=>{try{plane.data.setAll([{geometry:{type:'Point',coordinates:[SEOUL_LON,SEOUL_LAT]},title:'🇰🇷 서울'}]);}catch(e){}},600);

  _startIdleRot();
  setTimeout(renderGlobePins,800);
}

function _startIdleRot(){
  try{
    if(_globeChart)_globeChart.animate({key:'rotateX',from:_globeChart.get('rotateX')||(-SEOUL_LON),to:(_globeChart.get('rotateX')||(-SEOUL_LON))+360,duration:90000,loops:Infinity});
  }catch(e){}
}
function _stopIdleRot(){
  try{if(_globeChart)_globeChart.animate({key:'rotateX',to:_globeChart.get('rotateX')||0,duration:50});}catch(e){}
}

function renderGlobePins(){
  if(!window._gPins||!window._gDoneLine)return;
  try{window._gPins.data.clear();window._gDoneLine.data.clear();window._gCurLine&&window._gCurLine.data.clear();}catch(e){}

  try{window._gPins.data.push({geometry:{type:'Point',coordinates:[SEOUL_LON,SEOUL_LAT]},title:'🇰🇷 서울 (인천) — 홈',isHome:true});}catch(e){}

  const ordered=chronoTrips();
  ordered.forEach(t=>{
    const ll=_getGlobeLL(t);if(!ll)return;
    try{window._gPins.data.push({geometry:{type:'Point',coordinates:[ll[1],ll[0]]},title:`${t.flag||'🌍'} ${t.city||t.cntry}${t.df?' ('+t.df+')':''}`});}catch(e){}
  });

  const allLL=[[SEOUL_LON,SEOUL_LAT],...ordered.map(t=>_getGlobeLL(t)).filter(Boolean).map(ll=>[ll[1],ll[0]]),[SEOUL_LON,SEOUL_LAT]];
  for(let i=1;i<allLL.length;i++){
    try{window._gDoneLine.data.push({geometry:{type:'LineString',coordinates:[allLL[i-1],allLL[i]]}});}catch(e){}
  }
  const el=document.getElementById('globeStatus');
  if(el)el.textContent=`🇰🇷 서울 출발 · ${ordered.length}개 도시`;
}

function _gcInterp(lat1,lon1,lat2,lon2,t){
  const R=Math.PI/180,D=180/Math.PI;
  const phi1=lat1*R,lam1=lon1*R,phi2=lat2*R,lam2=lon2*R;
  const d=Math.acos(Math.max(-1,Math.min(1,Math.sin(phi1)*Math.sin(phi2)+Math.cos(phi1)*Math.cos(phi2)*Math.cos(lam2-lam1))));
  if(d<0.0001)return{lat:lat2,lon:lon2};
  const A=Math.sin((1-t)*d)/Math.sin(d),B=Math.sin(t*d)/Math.sin(d);
  const x=A*Math.cos(phi1)*Math.cos(lam1)+B*Math.cos(phi2)*Math.cos(lam2);
  const y=A*Math.cos(phi1)*Math.sin(lam1)+B*Math.cos(phi2)*Math.sin(lam2);
  const z=A*Math.sin(phi1)+B*Math.sin(phi2);
  return{lat:Math.atan2(z,Math.sqrt(x*x+y*y))*D,lon:Math.atan2(y,x)*D};
}

function _globeFly(fromLat,fromLon,toLat,toLon,label,onDone){
  if(!_globeChart)return;
  if(_globeDrawTimer){clearInterval(_globeDrawTimer);_globeDrawTimer=null;}

  try{
    _globeChart.animate({key:'rotateX',to:-toLon,duration:500});
    _globeChart.animate({key:'rotateY',to:-toLat*0.4,duration:500});
  }catch(e){}

  try{window._gCurLine&&window._gCurLine.data.clear();}catch(e){}

  const STEPS=50, DURATION=700;
  let step=0;
  const pts=[];
  _globeDrawTimer=setInterval(()=>{
    step++;
    const t=step/STEPS;
    const {lat:cLat,lon:cLon}=_gcInterp(fromLat,fromLon,toLat,toLon,t);

    try{window._gPlane&&window._gPlane.data.setAll([{geometry:{type:'Point',coordinates:[cLon,cLat]},title:label||''}]);}catch(e){}

    pts.push([cLon,cLat]);
    if(pts.length>1){try{window._gCurLine&&window._gCurLine.data.setAll([{geometry:{type:'LineString',coordinates:[...pts]}}]);}catch(e){}}

    if(label){const el=document.getElementById('globeStatus');if(el)el.textContent=label;}

    if(step>=STEPS){
      clearInterval(_globeDrawTimer);_globeDrawTimer=null;
      _globeFromLat=toLat;_globeFromLon=toLon;
      try{window._gCurLine&&window._gCurLine.data.clear();}catch(e){}
      if(onDone)setTimeout(onDone,200);
    }
  },DURATION/STEPS);
}

function _getOrdered(){
  const o=chronoTrips().filter(t=>t.df||t.dt);
  return o.length?o:chronoTrips();
}

function _flyNext(){
  if(!_globePlaying)return;
  const ordered=_getOrdered();
  if(!ordered.length)return;

  if(_globeAutoIdx>=ordered.length){
    _globeFly(_globeFromLat,_globeFromLon,SEOUL_LAT,SEOUL_LON,'🇰🇷 서울(인천) 귀환!',()=>{
      if(!_globePlaying)return;
      _globeAutoIdx=0;_globeFromLat=SEOUL_LAT;_globeFromLon=SEOUL_LON;
      try{window._gDoneLine&&window._gDoneLine.data.clear();}catch(e){}
      setTimeout(_flyNext,600);
    });
    return;
  }

  const t=ordered[_globeAutoIdx];
  const ll=_getGlobeLL(t);
  if(!ll){_globeAutoIdx++;setTimeout(_flyNext,50);return;}

  _globeFly(_globeFromLat,_globeFromLon,ll[0],ll[1],`✈️ ${t.flag||''} ${t.city||t.cntry}${t.df?' — '+t.df:''}`,()=>{
    if(!_globePlaying)return;
    _globeAutoIdx++;
    setTimeout(_flyNext,300);
  });
}

function globeTogglePlay(){
  _globePlaying=!_globePlaying;
  const btn=document.getElementById('globePlayBtn');
  const ico=document.getElementById('globePlayIco');
  const txt=document.getElementById('globePlayTxt');

  if(_globePlaying){
    btn.classList.add('playing');
    if(ico)ico.textContent='⏸';if(txt)txt.textContent='정지';
    _stopIdleRot();
    try{window._gDoneLine&&window._gDoneLine.data.clear();window._gCurLine&&window._gCurLine.data.clear();}catch(e){}
    _globeAutoIdx=0;_globeFromLat=SEOUL_LAT;_globeFromLon=SEOUL_LON;
    try{_globeChart.animate({key:'rotateX',to:-SEOUL_LON,duration:400});_globeChart.animate({key:'rotateY',to:-SEOUL_LAT*0.4,duration:400});}catch(e){}
    try{window._gPlane&&window._gPlane.data.setAll([{geometry:{type:'Point',coordinates:[SEOUL_LON,SEOUL_LAT]},title:'🇰🇷 서울'}]);}catch(e){}
    document.getElementById('globeStatus').textContent='🇰🇷 서울(인천) 출발!';
    setTimeout(_flyNext,700);
  }else{
    btn.classList.remove('playing');
    if(ico)ico.textContent='▶';if(txt)txt.textContent='자동 비행';
    if(_globeDrawTimer){clearInterval(_globeDrawTimer);_globeDrawTimer=null;}
    _startIdleRot();
  }
}

function globeReset(){
  _globePlaying=false;
  if(_globeDrawTimer){clearInterval(_globeDrawTimer);_globeDrawTimer=null;}
  const btn=document.getElementById('globePlayBtn');const ico=document.getElementById('globePlayIco');const txt=document.getElementById('globePlayTxt');
  if(btn)btn.classList.remove('playing');if(ico)ico.textContent='▶';if(txt)txt.textContent='자동 비행';
  _globeFromLat=SEOUL_LAT;_globeFromLon=SEOUL_LON;
  try{window._gCurLine&&window._gCurLine.data.clear();}catch(e){}
  try{window._gPlane&&window._gPlane.data.setAll([{geometry:{type:'Point',coordinates:[SEOUL_LON,SEOUL_LAT]},title:'🇰🇷 서울'}]);}catch(e){}
  try{
    if(_globeChart){
      _globeChart.animate({key:'rotateX',to:-SEOUL_LON,duration:600});
      _globeChart.animate({key:'rotateY',to:-SEOUL_LAT*0.4,duration:600});
      setTimeout(_startIdleRot,800);
    }
  }catch(e){}
  document.getElementById('globeStatus').textContent='🇰🇷 서울(인천) 대기 — ▶ 자동 비행!';
  setTimeout(renderGlobePins,400);
}

// ── 탭 전환 (지구본 탭 클릭 시 initGlobe 호출) ──
function switchTab(tab){
  curTab=tab;
  ['pageMap','pageGlobe','pageDash'].forEach(id=>{
    const el=document.getElementById(id);
    if(el)el.style.display=id==='page'+tab.charAt(0).toUpperCase()+tab.slice(1)?'':'none';
  });
  ['tabMap','tabGlobe','tabDash'].forEach(id=>{
    const el=document.getElementById(id);
    if(el)el.classList.toggle('on',id==='tab'+tab.charAt(0).toUpperCase()+tab.slice(1));
  });
  if(tab==='globe')initGlobe();
}
