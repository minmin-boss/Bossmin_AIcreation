<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boss min - AI creation</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fff0f5;
      --pink1: #ffcce0;
      --pink2: #ffadd0;
      --pink3: #ff85bb;
      --pink-deep: #e8476a;
      --pink-text: #d63a6a;
      --white: #ffffff;
      --shadow: rgba(232, 71, 106, 0.15);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* 파스텔 배경 그라디언트 */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse at 15% 15%, #ffd6e8 0%, transparent 45%),
        radial-gradient(ellipse at 85% 10%, #ffc2d8 0%, transparent 40%),
        radial-gradient(ellipse at 50% 90%, #ffcce0 0%, transparent 50%),
        linear-gradient(160deg, #fff5f8 0%, #ffe8f2 60%, #ffd6e8 100%);
    }

    /* 물방울 패턴 배경 */
    body::after {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image: radial-gradient(circle, #ffadd0 1.5px, transparent 1.5px);
      background-size: 32px 32px;
      opacity: 0.18;
    }

    .container {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center;
      padding: 36px 20px 60px;
      width: 100%; max-width: 480px;
      gap: 24px;
    }

    /* 헤더 박스 */
    .header-card {
      background: var(--white);
      border: 2.5px solid var(--pink1);
      border-radius: 32px;
      padding: 28px 24px 22px;
      width: 100%;
      text-align: center;
      box-shadow: 0 6px 0 var(--pink1), 0 10px 30px var(--shadow);
      animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      position: relative;
      overflow: visible;
    }

    @keyframes popIn {
      0% { transform: scale(0.7) translateY(20px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    /* 키티 이미지 */
    .kitty-wrap {
      width: 110px; height: 110px;
      margin: -60px auto 10px;
      animation: bounce 2.2s ease-in-out infinite;
      filter: drop-shadow(0 6px 12px rgba(232, 71, 106, 0.25));
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
    }
    .kitty-wrap img {
      width: 100%; height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }

    .header-card h1 {
      font-family: 'Nunito', sans-serif;
      font-size: 22px; font-weight: 900;
      color: var(--pink-text);
      letter-spacing: -0.3px;
      margin-bottom: 4px;
    }
    .header-card p {
      font-size: 12px; color: var(--pink2);
      font-weight: 500;
    }

    /* 리본 구분선 */
    .divider {
      display: flex; align-items: center; gap: 8px;
      margin: 10px 0 0;
    }
    .divider-line { flex: 1; height: 1.5px; background: var(--pink1); }
    .divider span { font-size: 14px; }

    /* 카드 그리드 */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px; width: 100%;
    }

    .card {
      background: var(--white);
      border: 2.5px solid var(--pink1);
      border-radius: 24px;
      padding: 26px 14px 20px;
      text-align: center;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 5px 0 var(--pink1), 0 8px 20px var(--shadow);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s;
      animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      position: relative;
      overflow: hidden;
    }
    .card:nth-child(1) { animation-delay: 0.15s; }
    .card:nth-child(2) { animation-delay: 0.25s; }

    /* 카드 배경 장식 */
    .card::after {
      content: '';
      position: absolute;
      bottom: -20px; right: -20px;
      width: 70px; height: 70px;
      background: var(--bg);
      border-radius: 50%;
      opacity: 0.6;
    }

    .card:hover {
      transform: translateY(-7px) scale(1.03);
      box-shadow: 0 10px 0 var(--pink2), 0 16px 32px var(--shadow);
      border-color: var(--pink3);
    }
    .card:active { transform: scale(0.95); box-shadow: 0 2px 0 var(--pink1); }

    .card-badge {
      position: absolute; top: 10px; right: 10px;
      background: linear-gradient(135deg, #ff85bb, #e8476a);
      color: white; font-size: 9px; font-weight: 700;
      padding: 2px 8px; border-radius: 20px;
      font-family: 'Nunito', sans-serif;
      letter-spacing: 0.5px;
    }

    .card-icon {
      font-size: 38px; display: block;
      margin-bottom: 10px;
      filter: drop-shadow(0 2px 6px var(--shadow));
    }
    .card-title {
      font-family: 'Nunito', sans-serif;
      font-size: 14px; font-weight: 800;
      color: var(--pink-text); margin-bottom: 5px;
    }
    .card-desc {
      font-size: 11px; color: var(--pink2);
      line-height: 1.65; position: relative; z-index: 1;
    }

    /* 하단 장식 */
    .bottom-row {
      display: flex; align-items: center; gap: 10px;
    }
    .dot {
      width: 9px; height: 9px; border-radius: 50%;
      animation: pulse 1.6s ease-in-out infinite;
    }
    .dot:nth-child(1) { background: var(--pink1); }
    .dot:nth-child(2) { background: var(--pink3); animation-delay: 0.2s; }
    .dot:nth-child(3) { background: var(--pink1); animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.4); opacity: 1; }
    }

    .footer { font-size: 11px; color: var(--pink2); }

    /* 떠다니는 꽃 */
    .floaties { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .floaty {
      position: absolute; opacity: 0;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0%   { transform: translateY(105vh) rotate(0deg);   opacity: 0; }
      8%   { opacity: 0.2; }
      92%  { opacity: 0.2; }
      100% { transform: translateY(-5vh)  rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="floaties" id="floaties"></div>

  <div class="container">

    <div class="header-card">
      <div class="kitty-wrap">
        <img src="kitty.png" alt="Hello Kitty">
      </div>
      <h1>Boss min - AI creation</h1>
      <p>원하는 메뉴를 선택해주세요 🎀</p>
      <div class="divider">
        <div class="divider-line"></div>
        <span>🎀</span>
        <div class="divider-line"></div>
      </div>
    </div>

    <div class="grid">
      <a class="card" href="office_supplies.html">
        <span class="card-badge">NEW</span>
        <span class="card-icon">🖊️</span>
        <div class="card-title">비품 소원함</div>
        <div class="card-desc">필요한 비품을 신청하고 현황을 확인해요</div>
      </a>
      <a class="card" href="dayoff-worklife_balance.html">
        <span class="card-icon">🌴</span>
        <div class="card-title">휴가 / 워라밸</div>
        <div class="card-desc">휴가 신청 및 워크라이프 밸런스 관리</div>
      </a>
    </div>

    <div class="bottom-row">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <div class="footer">🎀 ⓒ Boss min - AI creation 🎀</div>

  </div>

  <script>
    const el = document.getElementById('floaties');
    ['🌸','🩷','💕','🎀','✨','🌷','💗'].forEach((e, i) => {
      for (let j = 0; j < 3; j++) {
        const d = document.createElement('span');
        d.className = 'floaty';
        d.textContent = e;
        d.style.left = (Math.random() * 100) + 'vw';
        d.style.fontSize = (10 + Math.random() * 12) + 'px';
        d.style.animationDuration = (10 + Math.random() * 12) + 's';
        d.style.animationDelay = (Math.random() * 14) + 's';
        el.appendChild(d);
      }
    });
  </script>

</body>
</html>
