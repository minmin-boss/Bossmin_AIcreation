<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>BOSS-AI 대시보드</title>
    <style>
        /* 기본 레이아웃 */
        body { background-color: #fff; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; font-family: 'Pretendard', sans-serif; }
        .pw { width: 1000px; margin-top: 50px; position: relative; }

        /* 상단 핑크 배너 및 리본 섹션 */
        .header-banner { background-color: #ff4081; width: 100%; height: 180px; border-radius: 50px 50px 0 0; position: relative; text-align: center; color: #fff; padding-top: 30px; }
        .ribbon-icon { font-size: 80px; filter: drop-shadow(0 4px 5px rgba(0,0,0,0.2)); margin-bottom: 10px; display: block; }
        .title { font-size: 32px; font-weight: 900; letter-spacing: 1px; }

        /* 테마 스위처 (우측 상단) */
        .tsw { position: absolute; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 15px; }
        .tsw-btn { width: 65px; height: 65px; border-radius: 50%; border: 3px solid #fff; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.15); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .tsw-btn img { width: 100%; height: 100%; object-fit: cover; }
        .tsw-btn.on { border-color: #fff; transform: scale(1.1); box-shadow: 0 0 20px rgba(255,255,255,0.6); }

        /* 내비게이션 바 */
        .nav-bar { display: flex; justify-content: center; gap: 15px; margin-top: -30px; position: relative; z-index: 10; }
        .nav-item { background: #fff; padding: 12px 25px; border-radius: 30px; border: 2px solid #ffb3c8; font-weight: bold; color: #ff4081; cursor: pointer; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .nav-item.active { background: #ff4081; color: #fff; border-color: #ff4081; }

        /* 메인 카드 영역 */
        .main-container { background: #fce4ec; border-radius: 0 0 50px 50px; padding: 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; box-sizing: border-box; }
        .card { background: #fff; border-radius: 25px; padding: 30px; text-align: center; border: 1px solid #ffcfdf; transition: 0.3s; position: relative; overflow: hidden; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(255,128,171,0.15); }
        .card-icon { font-size: 40px; margin-bottom: 15px; display: block; }
        .card-title { font-size: 18px; font-weight: bold; color: #d81b60; margin-bottom: 10px; }
        .card-desc { font-size: 13px; color: #888; line-height: 1.5; margin-bottom: 20px; }
        .btn-enter { background: #ff4081; color: #fff; padding: 8px 20px; border-radius: 20px; font-size: 12px; border: none; cursor: pointer; }
        
        /* 하단 푸터 */
        .footer { width: 100%; background: #ff4081; padding: 15px 0; border-radius: 0 0 50px 50px; text-align: center; color: #fff; font-size: 14px; margin-top: -20px; }
    </style>
</head>
<body>

<div class="pw">
    <!-- 헤더 영역 -->
    <div class="header-banner">
        <span class="ribbon-icon">🎀</span>
        <div class="title">BOSS-AI Creation</div>
        <div style="font-size: 14px; margin-top: 5px; opacity: 0.9;">✨ 원하는 메뉴를 클릭해서 들어가세요 ✨</div>
        
        <!-- 테마 전환 버튼 -->
        <div class="tsw">
            <div class="tsw-btn on"><img src="https://i.imgur.com/8N7fX8t.png" alt="Kitty"></div>
            <div class="tsw-btn"><img src="https://i.imgur.com/uC3G2o7.png" alt="Insta"></div>
            <div class="tsw-btn"><img src="https://i.imgur.com/6S3Yf9u.png" alt="Cyworld"></div>
        </div>
    </div>

    <!-- 내비게이션 -->
    <div class="nav-bar">
        <div class="nav-item active">🏠 홈</div>
        <div class="nav-item">🎁 비품소원함</div>
        <div class="nav-item">🌸 연차/워라밸</div>
        <div class="nav-item">📊 업무현황</div>
        <div class="nav-item">💬 팀 채팅</div>
    </div>

    <!-- 메인 카드 섹션 -->
    <div class="main-container">
        <div class="card">
            <span class="card-icon">✏️</span>
            <div class="card-title">비품 소원함</div>
            <div class="card-desc">필요한 비품을 신청하고<br>처리 현황을 확인해요</div>
            <button class="btn-enter">🎀 클릭해서 입장</button>
        </div>
        <div class="card">
            <span class="card-icon">🌴</span>
            <div class="card-title">휴가 / 워라밸</div>
            <div class="card-desc">휴가 신청 및 워크라이프<br>밸런스 관리</div>
            <button class="btn-enter">🌸 클릭해서 입장</button>
        </div>
        <div class="card" style="opacity: 0.6;">
            <span class="card-icon">📊</span>
            <div class="card-title">업무 현황</div>
            <div class="card-desc">팀 전체 업무 진행 현황<br><small>[준비중]</small></div>
        </div>
        <div class="card" style="opacity: 0.6;">
            <span class="card-icon">💬</span>
            <div class="card-title">팀 채팅</div>
            <div class="card-desc">팀원들과 빠르게 소통해요<br><small>[준비중]</small></div>
        </div>
    </div>

    <!-- 푸터 -->
    <div class="footer">
        🎀 © 민민사사 내부 도구 🎀
    </div>
</div>

</body>
</html>
