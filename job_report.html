<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>REPORT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAFDFB; --paper:#FFFFFF; --ink:#2E3A33; --ink-2:#6A7B70; --rule:#E4EEE7;
  --seal:#C9463D; --blue:#4E9E6E; --muted:#93A399; --hover:#F7FBF8;
  --soft:#E3F2E7; --soft-ink:#2F5A40; --soft-line:#C6E1CE;
  --sans:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --serif:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121A15; --paper:#1A241E; --ink:#E4EFE7; --ink-2:#A3BBAB; --rule:#2B3B31;
    --seal:#E87A72; --blue:#6CC48F; --muted:#7E9286; --hover:#213028; --soft:#24382B; --soft-ink:#BFE3CA; --soft-line:#355440;
  }
}
:root[data-theme="dark"]{
  --bg:#121A15; --paper:#1A241E; --ink:#E4EFE7; --ink-2:#A3BBAB; --rule:#2B3B31;
  --seal:#E87A72; --blue:#6CC48F; --muted:#7E9286; --hover:#213028; --soft:#24382B; --soft-ink:#BFE3CA; --soft-line:#355440;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:40px 24px 64px}

header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--soft-line);padding-bottom:16px}
h1{font-family:var(--serif);font-weight:400;font-size:38px;letter-spacing:.02em;margin:0;line-height:1.2}
.lede{margin:6px 0 0;color:var(--ink-2);font-size:14px}
.btn{border:1px solid var(--rule);background:var(--paper);border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:14px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--soft);color:var(--soft-ink);border-color:var(--soft-line);font-weight:600}
.btn.primary:hover{background:var(--soft-line)}
.btn.danger{color:var(--seal);border-color:transparent;background:transparent}
.btn.danger:hover{background:var(--hover)}
.btn.small{padding:4px 10px;font-size:13px}

.note{margin:12px 0 0;font-size:13px;color:var(--ink-2)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;margin-top:24px}
@media (max-width:860px){.layout{grid-template-columns:1fr}.aside{order:-1}}

.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{flex:1 1 200px;min-width:0;border:1px solid var(--rule);background:var(--paper);border-radius:6px;padding:8px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.chip b{font-weight:600;color:var(--ink);margin-left:4px}
.chip[aria-pressed="true"]{background:var(--soft);color:var(--soft-ink);border-color:var(--soft-line)}
.chip[aria-pressed="true"] b{color:var(--soft-ink)}

.ledger{background:var(--paper);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) 96px 150px 92px;gap:12px;align-items:center;padding:14px 18px;border-top:1px solid var(--rule);cursor:pointer;width:100%;text-align:left;background:transparent;border-left:0;border-right:0;border-bottom:0}
.row:first-child{border-top:0}
.row:hover{background:var(--hover)}
.row.head{cursor:default;font-size:12px;color:var(--muted);padding-top:10px;padding-bottom:10px;background:var(--bg)}
.row.head:hover{background:var(--bg)}
.co{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.cell.soon{color:var(--blue);font-weight:500}
@media (max-width:620px){
  .row{grid-template-columns:minmax(0,1fr) auto;row-gap:2px}
  .row.head{display:none}
  .row .c-date{display:none}
  .row .c-next{grid-column:1;grid-row:2}
  .row .c-seal{grid-column:2;grid-row:1 / span 2}
}

/* the seal: status as a stamp */
.seal{display:inline-flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:400;font-size:13px;letter-spacing:.04em;padding:3px 8px;border:2px solid currentColor;border-radius:4px;box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 3px currentColor;transform:rotate(-3deg);white-space:nowrap;color:var(--ink-2)}
.seal[data-s="면접예정"]{color:var(--blue)}
.seal[data-s="서류합격"],.seal[data-s="면접완료"]{color:var(--ink)}
.seal[data-s="최종합격"]{color:var(--seal)}
.seal[data-s="불합격"],.seal[data-s="지원취소"]{color:var(--muted);transform:rotate(-3deg);opacity:.85}
.seal.big{font-size:20px;padding:6px 14px;transform:rotate(-6deg)}

.empty{padding:48px 24px;text-align:center;color:var(--ink-2)}
.empty p{margin:0 0 16px}

.aside h2,.detail h3{font-family:var(--serif);font-weight:400;font-size:18px;margin:0 0 12px}
.up{list-style:none;margin:0;padding:0;border-left:2px solid var(--rule)}
.up li{padding:0 0 16px 16px;position:relative}
.up li::before{content:"";position:absolute;left:-6px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--paper);border:2px solid var(--blue)}
.up .when{font-size:13px;color:var(--blue);font-weight:600;font-variant-numeric:tabular-nums}
.up .what{font-size:14px}
.up button{all:unset;cursor:pointer;display:block}
.up button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.up-empty{font-size:13px;color:var(--ink-2);margin:0}

dialog{border:1px solid var(--rule);border-radius:10px;padding:0;background:var(--paper);color:var(--ink);width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:rgba(30,45,36,.35)}
.dlg{padding:24px;overflow:auto;max-height:calc(100vh - 48px)}
.dlg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px}
.dlg-head h2{font-family:var(--serif);font-weight:400;font-size:24px;margin:0;line-height:1.3;word-break:keep-all}
.x{border:0;background:transparent;font-size:22px;line-height:1;cursor:pointer;color:var(--ink-2);padding:4px 8px}
.meta{display:grid;grid-template-columns:88px 1fr;gap:4px 12px;font-size:14px;margin:0 0 16px}
.meta dt{color:var(--muted)}
.meta dd{margin:0}
.memo{white-space:pre-wrap;font-size:14px;background:var(--bg);border-radius:6px;padding:10px 12px;margin:0 0 16px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.detail{border-top:1px solid var(--rule);margin-top:20px;padding-top:20px}
.detail-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.detail-top h3{margin:0}
.iv{border:1px solid var(--rule);border-radius:8px;padding:14px 16px;margin-bottom:12px}
.iv-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.iv-h strong{font-size:15px}
.iv-when{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.iv-when.tbd{color:var(--seal)}
.tag{font-size:12px;border:1px solid var(--rule);border-radius:4px;padding:1px 6px;color:var(--ink-2)}
.tag[data-r="합격"]{color:var(--blue);border-color:currentColor}
.tag[data-r="불합격"]{color:var(--muted)}
.review{white-space:pre-wrap;font-size:14px;margin:10px 0 8px;line-height:1.7}
.review.none{color:var(--muted)}

form .f{display:block;margin-bottom:14px}
form .f span{display:block;font-size:13px;color:var(--ink-2);margin-bottom:4px}
form input,form select,form textarea{width:100%;border:1px solid var(--rule);border-radius:6px;padding:8px 10px;background:var(--paper)}
form textarea{min-height:96px;resize:vertical;line-height:1.6}
form textarea.tall{min-height:180px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.req{color:var(--seal)}
.form-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--soft-ink);color:#fff;padding:10px 16px;border-radius:6px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>REPORT</h1>
      <p class="lede">지원한 회사, 면접 일정, 면접 후기를 한곳에 적어 둡니다.</p>
    </div>
    <button class="btn primary" id="addApp" type="button">회사 추가</button>
  </header>

  <div class="layout">
    <main>
      <div class="tools">
        <input class="search" id="q" type="search" placeholder="회사명이나 직무로 찾기" aria-label="회사명이나 직무로 찾기">
      </div>
      <div class="chips" id="chips" role="group" aria-label="진행 상태로 거르기"></div>
      <div class="ledger" id="ledger"><div class="empty"><p>불러오는 중입니다…</p></div></div>
    </main>
    <aside class="aside">
      <h2>다가오는 면접</h2>
      <div id="upcoming"><p class="up-empty">불러오는 중입니다…</p></div>
    </aside>
  </div>
</div>

<!-- detail -->
<dialog id="dDetail" aria-labelledby="dTitle">
  <div class="dlg" id="detailBody"></div>
</dialog>

<!-- application form -->
<dialog id="dApp" aria-labelledby="appFormTitle">
  <div class="dlg">
    <div class="dlg-head"><h2 id="appFormTitle">회사 추가</h2><button class="x" type="button" data-close aria-label="닫기">×</button></div>
    <form id="appForm" novalidate>
      <label class="f"><span>회사명 <em class="req">*</em></span><input name="company_name" required maxlength="80"></label>
      <div class="grid2">
        <label class="f"><span>지원 직무</span><input name="position" maxlength="80" placeholder="예: 법인세 신고 담당"></label>
        <label class="f"><span>지원일</span><input name="applied_date" type="date"></label>
        <label class="f"><span>지원 경로</span><input name="channel" maxlength="60" list="channels" placeholder="예: 사람인"></label>
        <label class="f"><span>진행 상태</span><select name="status" id="statusSel"></select></label>
      </div>
      <datalist id="channels"><option value="사람인"><option value="잡코리아"><option value="한국세무사회 구인"><option value="지인 추천"><option value="회사 홈페이지"></datalist>
      <label class="f"><span>메모</span><textarea name="memo" maxlength="4000" placeholder="연봉 조건, 담당자 연락처, 준비할 것 등"></textarea></label>
      <div class="form-foot"><button class="btn" type="button" data-close>취소</button><button class="btn primary" type="submit" id="appSubmit">저장</button></div>
    </form>
  </div>
</dialog>

<!-- interview form -->
<dialog id="dIv" aria-labelledby="ivFormTitle">
  <div class="dlg">
    <div class="dlg-head"><h2 id="ivFormTitle">면접 추가</h2><button class="x" type="button" data-close aria-label="닫기">×</button></div>
    <form id="ivForm" novalidate>
      <div class="grid2">
        <label class="f"><span>차수</span><input name="round" type="number" min="1" max="9" required></label>
        <label class="f"><span>결과</span><select name="result"><option>대기</option><option>합격</option><option>불합격</option></select></label>
        <label class="f"><span>면접 일시 (미정이면 비워 두세요)</span><input name="scheduled_at" type="datetime-local"></label>
        <label class="f"><span>장소</span><input name="location" maxlength="120" placeholder="예: 강남본점 3층 / 화상"></label>
      </div>
      <label class="f"><span>면접 후기</span><textarea class="tall" name="review" maxlength="20000" placeholder="받은 질문, 분위기, 아쉬웠던 답변, 느낀 점을 자유롭게 적어 주세요."></textarea></label>
      <div class="form-foot"><button class="btn" type="button" data-close>취소</button><button class="btn primary" type="submit">저장</button></div>
    </form>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ▼ Firebase 콘솔 > 프로젝트 설정 > 내 앱 > SDK 설정 및 구성(구성)에서 복사한 값을 붙여 넣으세요. */
const firebaseConfig = {
  apiKey: "AIzaSyDBWiZeSQEysBR6-ppR4aVUiX9rbEOjzGY",
  authDomain: "job-report-14642.firebaseapp.com",
  projectId: "job-report-14642",
  storageBucket: "job-report-14642.firebasestorage.app",
  messagingSenderId: "155697589399",
  appId: "1:155697589399:web:9c920564e00849f1940dd2",
  measurementId: "G-4N11RE5P95"
};
</script>
<script>
(function(){
  const STATUSES = ['지원완료','서류합격','면접예정','면접완료','최종합격','불합격','지원취소'];
  const LS_KEY = 'jobtracker.apps.v1';
  const state = { apps: [], filter: '전체', q: '', mode: 'loading', openId: null, editAppId: null, editIv: null };
  let col = null;

  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const WD = ['일','월','화','수','목','금','토'];

  function toDate(s){ if(!s) return null; const d = new Date(s.length === 10 ? s + 'T00:00' : s); return isNaN(d) ? null : d; }
  function fmtDay(s){ const d = toDate(s); if(!d) return ''; return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`; }
  function fmtWhen(s){ const d = toDate(s); if(!d) return ''; const hm = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; return `${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]}) ${hm}`; }
  function dday(s){ const d = toDate(s); if(!d) return ''; const a = new Date(); a.setHours(0,0,0,0); const b = new Date(d); b.setHours(0,0,0,0); const n = Math.round((b - a) / 864e5); return n === 0 ? '오늘' : n === 1 ? '내일' : n > 0 ? `D-${n}` : ''; }

  function ivs(a){ return Array.isArray(a.interviews) ? a.interviews : []; }
  function effStatus(a){
    if(a.status === '면접예정'){
      const now = new Date(), list = ivs(a).filter(i => toDate(i.scheduled_at));
      if(list.length && !list.some(i => toDate(i.scheduled_at) > now)) return '면접완료';
    }
    return a.status || '지원완료';
  }
  function nextIv(a){
    const now = new Date();
    return ivs(a).filter(i => toDate(i.scheduled_at) > now).sort((x, y) => toDate(x.scheduled_at) - toDate(y.scheduled_at))[0] || null;
  }
  function nextLabel(a){
    const n = nextIv(a);
    if(n) return { text: `${n.round}차 ${fmtWhen(n.scheduled_at).replace(/ \d\d:\d\d$/, '')}`, soon: true };
    const s = effStatus(a);
    if((s === '서류합격' || s === '면접예정') ) return { text: '면접 일정 미정', soon: false };
    return { text: '—', soon: false };
  }

  /* ---------- storage ---------- */
  function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('on'), 2200); }

  const VAULT = 'v1de2b7ab81aadc0647888d72';

  function init(){
    if(!window.firebase || !firebaseConfig.apiKey){ state.mode = 'noconfig'; render(); return; }
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    col = firebase.firestore().collection('jobReports').doc(VAULT).collection('applications');
    col.onSnapshot(snap => {
      state.mode = 'db';
      state.apps = snap.docs.map(d => Object.assign({}, d.data(), { id: d.id }));
      render();
      if(state.openId) renderDetail();
    }, () => toast('기록을 불러오지 못했습니다.'));
  }

  async function saveApp(app){
    if(!col){ toast('저장소에 연결하지 못했습니다.'); return false; }
    app.updated_at = new Date().toISOString();
    try { await col.doc(app.id).set(JSON.parse(JSON.stringify(app))); return true; }
    catch(e){ toast('저장하지 못했습니다. (' + (e && e.code || 'error') + ')'); return false; }
  }
  async function removeApp(id){
    if(!col) return false;
    try { await col.doc(id).delete(); return true; }
    catch(e){ toast('삭제하지 못했습니다. (' + (e && e.code || 'error') + ')'); return false; }
  }
  const getApp = id => state.apps.find(a => a.id === id);

  /* ---------- render ---------- */
  function render(){
    const q = state.q.trim().toLowerCase();
    const counts = { '전체': state.apps.length };
    STATUSES.forEach(s => counts[s] = 0);
    state.apps.forEach(a => { const s = effStatus(a); counts[s] = (counts[s] || 0) + 1; });

    $('#chips').innerHTML = ['전체'].concat(STATUSES).filter(s => s === '전체' || counts[s] > 0 || state.filter === s)
      .map(s => `<button type="button" class="chip" data-f="${esc(s)}" aria-pressed="${state.filter === s}">${esc(s)}<b>${counts[s]}</b></button>`).join('');

    const list = state.apps
      .filter(a => state.filter === '전체' || effStatus(a) === state.filter)
      .filter(a => !q || (a.company_name || '').toLowerCase().includes(q) || (a.position || '').toLowerCase().includes(q))
      .sort((x, y) => (y.applied_date || '').localeCompare(x.applied_date || '') || (y.updated_at || '').localeCompare(x.updated_at || ''));

    const ledger = $('#ledger');
    if(state.mode === 'noconfig'){
      ledger.innerHTML = `<div class="empty"><p>저장소에 연결하지 못했습니다. 잠시 후 다시 열어 주세요.</p></div>`;
      $('#upcoming').innerHTML = '';
      return;
    }
    if(state.mode === 'loading'){
      ledger.innerHTML = `<div class="empty"><p>불러오는 중입니다…</p></div>`;
      $('#upcoming').innerHTML = `<p class="up-empty">불러오는 중입니다…</p>`;
      return;
    }
    if(!state.apps.length){
      ledger.innerHTML = `<div class="empty"><p>아직 기록한 지원 회사가 없습니다.<br>지원한 회사부터 하나씩 적어 보세요.</p><button class="btn primary" type="button" data-act="add">회사 추가</button></div>`;
    } else if(!list.length){
      ledger.innerHTML = `<div class="empty"><p>조건에 맞는 회사가 없습니다. 검색어나 상태 필터를 바꿔 보세요.</p></div>`;
    } else {
      ledger.innerHTML = `<div class="row head" aria-hidden="true"><span>회사 / 직무</span><span>지원일</span><span>다음 면접</span><span>상태</span></div>` +
        list.map(a => { const n = nextLabel(a), s = effStatus(a); return `<button type="button" class="row" data-open="${esc(a.id)}">
          <span><span class="co">${esc(a.company_name)}</span><span class="pos">${esc(a.position || '직무 미기재')}</span></span>
          <span class="cell c-date">${esc(fmtDay(a.applied_date) || '—')}</span>
          <span class="cell c-next${n.soon ? ' soon' : ''}">${esc(n.text)}</span>
          <span class="c-seal"><span class="seal" data-s="${esc(s)}">${esc(s)}</span></span>
        </button>`; }).join('');
    }

    const now = new Date();
    const ups = [];
    state.apps.forEach(a => ivs(a).forEach(i => { const d = toDate(i.scheduled_at); if(d && d > now) ups.push({ a, i, d }); }));
    ups.sort((x, y) => x.d - y.d);
    $('#upcoming').innerHTML = ups.length
      ? `<ul class="up">${ups.slice(0, 6).map(u => `<li><button type="button" data-open="${esc(u.a.id)}"><div class="when">${esc(dday(u.i.scheduled_at))} · ${esc(fmtWhen(u.i.scheduled_at))}</div><div class="what">${esc(u.a.company_name)} ${esc(u.i.round)}차 면접</div></button></li>`).join('')}</ul>`
      : `<p class="up-empty">잡힌 면접 일정이 없습니다. 회사 상세에서 면접을 추가하면 여기에 표시됩니다.</p>`;
  }

  function renderDetail(){
    const a = getApp(state.openId);
    const box = $('#detailBody');
    if(!a){ $('#dDetail').close(); return; }
    const s = effStatus(a);
    const list = ivs(a).slice().sort((x, y) => (x.round || 0) - (y.round || 0));
    box.innerHTML = `
      <div class="dlg-head">
        <div><h2 id="dTitle">${esc(a.company_name)}</h2><div class="pos">${esc(a.position || '직무 미기재')}</div></div>
        <div style="display:flex;align-items:center;gap:12px"><span class="seal big" data-s="${esc(s)}">${esc(s)}</span><button class="x" type="button" data-close aria-label="닫기">×</button></div>
      </div>
      <dl class="meta">
        <dt>지원일</dt><dd>${esc(fmtDay(a.applied_date) || '—')}</dd>
        <dt>지원 경로</dt><dd>${esc(a.channel || '—')}</dd>
      </dl>
      ${a.memo ? `<p class="memo">${esc(a.memo)}</p>` : ''}
      <div class="actions"><button class="btn small" type="button" data-act="edit-app">회사 정보 수정</button><button class="btn small danger" type="button" data-act="del-app">회사 삭제</button></div>
      <section class="detail">
        <div class="detail-top"><h3>면접 기록</h3><button class="btn small primary" type="button" data-act="add-iv">면접 추가</button></div>
        ${list.length ? list.map(i => `<article class="iv">
          <div class="iv-h"><strong>${esc(i.round)}차 면접</strong>
            <span>${i.scheduled_at ? `<span class="iv-when">${esc(fmtWhen(i.scheduled_at))}${i.location ? ' · ' + esc(i.location) : ''}</span>` : `<span class="iv-when tbd">일정 미정${i.location ? ' · ' + esc(i.location) : ''}</span>`} <span class="tag" data-r="${esc(i.result || '대기')}">${esc(i.result || '대기')}</span></span>
          </div>
          <p class="review${i.review ? '' : ' none'}">${i.review ? esc(i.review) : '아직 후기를 적지 않았습니다.'}</p>
          <div class="actions"><button class="btn small" type="button" data-act="edit-iv" data-iv="${esc(i.id)}">일정·후기 수정</button><button class="btn small danger" type="button" data-act="del-iv" data-iv="${esc(i.id)}">삭제</button></div>
        </article>`).join('') : `<p class="up-empty">면접 기록이 없습니다. 일정이 잡히면 추가해 주세요. 일정 없이 차수만 먼저 적어 둘 수도 있습니다.</p>`}
      </section>`;
  }

  /* ---------- forms ---------- */
  $('#statusSel').innerHTML = STATUSES.map(s => `<option>${s}</option>`).join('');

  function openAppForm(id){
    state.editAppId = id || null;
    const f = $('#appForm'); f.reset();
    $('#appFormTitle').textContent = id ? '회사 정보 수정' : '회사 추가';
    if(id){ const a = getApp(id); ['company_name','position','applied_date','channel','status','memo'].forEach(k => f.elements[k].value = a[k] || ''); }
    else { f.elements.applied_date.value = new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10); f.elements.status.value = '지원완료'; }
    $('#dApp').showModal(); f.elements.company_name.focus();
  }
  $('#appForm').addEventListener('submit', async e => {
    e.preventDefault();
    const f = e.target, name = f.elements.company_name.value.trim();
    if(!name){ toast('회사명을 입력해 주세요.'); f.elements.company_name.focus(); return; }
    const base = state.editAppId ? JSON.parse(JSON.stringify(getApp(state.editAppId))) : { id: newId(), interviews: [], created_at: new Date().toISOString() };
    Object.assign(base, { company_name: name, position: f.elements.position.value.trim(), applied_date: f.elements.applied_date.value, channel: f.elements.channel.value.trim(), status: f.elements.status.value, memo: f.elements.memo.value });
    if(await saveApp(base)){ $('#dApp').close(); toast(state.editAppId ? '회사 정보를 저장했습니다.' : '회사를 추가했습니다.'); if(state.openId === base.id) renderDetail(); }
  });

  function openIvForm(ivId){
    const a = getApp(state.openId); if(!a) return;
    state.editIv = ivId || null;
    const f = $('#ivForm'); f.reset();
    $('#ivFormTitle').textContent = ivId ? '면접 일정·후기 수정' : '면접 추가';
    if(ivId){ const i = ivs(a).find(x => x.id === ivId); ['round','result','scheduled_at','location','review'].forEach(k => f.elements[k].value = i[k] == null ? '' : i[k]); }
    else { f.elements.round.value = ivs(a).reduce((m, i) => Math.max(m, Number(i.round) || 0), 0) + 1; f.elements.result.value = '대기'; }
    $('#dIv').showModal();
  }
  $('#ivForm').addEventListener('submit', async e => {
    e.preventDefault();
    const f = e.target, a = JSON.parse(JSON.stringify(getApp(state.openId)));
    a.interviews = ivs(a);
    const data = { round: Math.max(1, parseInt(f.elements.round.value, 10) || 1), result: f.elements.result.value, scheduled_at: f.elements.scheduled_at.value, location: f.elements.location.value.trim(), review: f.elements.review.value };
    if(state.editIv){ const i = a.interviews.find(x => x.id === state.editIv); Object.assign(i, data); }
    else a.interviews.push(Object.assign({ id: newId() }, data));
    const d = toDate(data.scheduled_at);
    if(d && d > new Date() && (a.status === '지원완료' || a.status === '서류합격')) a.status = '면접예정';
    if(await saveApp(a)){ $('#dIv').close(); toast('면접 기록을 저장했습니다.'); renderDetail(); }
  });

  /* ---------- events ---------- */
  $('#addApp').addEventListener('click', () => openAppForm());
  $('#q').addEventListener('input', e => { state.q = e.target.value; render(); });

  document.addEventListener('click', async e => {
    const t = e.target.closest('[data-f],[data-open],[data-act],[data-close]');
    if(!t) return;
    if(t.dataset.f){ state.filter = t.dataset.f; render(); return; }
    if(t.dataset.open){ state.openId = t.dataset.open; renderDetail(); const d = $('#dDetail'); if(!d.open) d.showModal(); return; }
    if(t.hasAttribute('data-close')){ t.closest('dialog').close(); return; }
    const act = t.dataset.act;
    if(act === 'add') openAppForm();
    if(act === 'edit-app') openAppForm(state.openId);
    if(act === 'add-iv') openIvForm();
    if(act === 'edit-iv') openIvForm(t.dataset.iv);
    if(act === 'del-app'){
      const a = getApp(state.openId);
      if(a && confirm(`'${a.company_name}' 기록과 면접 후기를 모두 삭제할까요?`)){ if(await removeApp(a.id)){ $('#dDetail').close(); state.openId = null; toast('회사를 삭제했습니다.'); } }
    }
    if(act === 'del-iv'){
      const a = JSON.parse(JSON.stringify(getApp(state.openId)));
      const i = ivs(a).find(x => x.id === t.dataset.iv);
      if(i && confirm(`${i.round}차 면접 기록을 삭제할까요?`)){ a.interviews = ivs(a).filter(x => x.id !== i.id); if(await saveApp(a)){ toast('면접 기록을 삭제했습니다.'); renderDetail(); } }
    }
  });
  $('#dDetail').addEventListener('close', () => { state.openId = null; });

  render();
  init();
})();
</script>
</body>
</html>
